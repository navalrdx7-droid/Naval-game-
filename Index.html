<!DOCTYPE html>
<html>
<head>

<title>NAVAL GAME</title>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  text-align:center;
}

/* TITLE */

h1{
  margin:8px 0 6px;
  font-size:25px;
  letter-spacing:2px;
}

/* INFO */

#info{
  width:94%;
  max-width:650px;
  margin:auto;
  padding:9px 6px;

  border-radius:13px;

  background:rgba(0,0,0,.65);

  font-size:15px;
  font-weight:bold;
}

/* LEVEL */

#levelUp{
  display:none;

  margin:5px 0;

  color:#facc15;

  font-size:22px;
  font-weight:bold;

  text-shadow:
    0 2px 5px #000;
}

/* =========================
   GAME
========================= */

#game{

  position:relative;

  width:96vw;

  height:62vh;

  min-height:360px;
  max-height:650px;

  margin:8px auto;

  overflow:hidden;

  border:3px solid white;

  border-radius:18px;

  background:
  linear-gradient(
    #38bdf8 0%,
    #bae6fd 53%,
    #86efac 53%,
    #4d7c0f 100%
  );

  box-shadow:
    0 8px 30px rgba(0,0,0,.7);
}

/* SUN */

#sun{

  position:absolute;

  width:55px;
  height:55px;

  right:6vw;
  top:20px;

  background:#fde047;

  border-radius:50%;

  box-shadow:
    0 0 25px #fde047;
}

/* CLOUD */

.cloud{

  position:absolute;

  width:70px;
  height:22px;

  background:white;

  border-radius:20px;

  opacity:.9;
}

.cloud:before,
.cloud:after{

  content:"";

  position:absolute;

  background:white;

  border-radius:50%;
}

.cloud:before{

  width:32px;
  height:32px;

  left:10px;
  top:-15px;
}

.cloud:after{

  width:27px;
  height:27px;

  right:8px;
  top:-12px;
}

.cloud1{
  left:6%;
  top:45px;
}

.cloud2{
  left:58%;
  top:85px;
}

.cloud3{
  left:30%;
  top:140px;
  transform:scale(.7);
}

/* MOUNTAINS */

.mountain{

  position:absolute;

  bottom:130px;

  width:0;
  height:0;

  border-left:
    70px solid transparent;

  border-right:
    70px solid transparent;

  border-bottom:
    120px solid #64748b;
}

.m1{
  left:-60px;
}

.m2{
  left:25%;
  border-bottom-color:#475569;
}

.m3{
  left:55%;
  border-bottom-color:#334155;
}

.m4{
  left:85%;
  border-bottom-color:#475569;
}

/* TREES */

.tree{

  position:absolute;

  bottom:55px;

  width:20px;
  height:65px;

  background:#713f12;

  border-radius:4px;

  z-index:3;
}

.tree:before{

  content:"";

  position:absolute;

  width:55px;
  height:55px;

  left:-18px;
  top:-38px;

  background:#166534;

  border-radius:50%;

  box-shadow:
    20px -15px 0 #15803d,
    38px 3px 0 #166534;
}

.tree1{
  left:5%;
}

.tree2{
  left:30%;
  transform:scale(.8);
}

.tree3{
  left:72%;
}

.tree4{
  left:90%;
  transform:scale(.7);
}

/* BUSH */

.bush{

  position:absolute;

  bottom:48px;

  width:60px;
  height:25px;

  background:#166534;

  border-radius:50px 50px 10px 10px;

  z-index:4;
}

.bush:before,
.bush:after{

  content:"";

  position:absolute;

  background:#15803d;

  border-radius:50%;
}

.bush:before{

  width:30px;
  height:30px;

  left:6px;
  top:-15px;
}

.bush:after{

  width:32px;
  height:32px;

  right:4px;
  top:-17px;
}

.bush1{
  left:15%;
}

.bush2{
  left:50%;
}

.bush3{
  left:78%;
}

/* GROUND */

#ground{

  position:absolute;

  bottom:0;

  width:100%;
  height:55px;

  background:
    linear-gradient(
      #65a30d,
      #3f6212
    );

  border-top:
    5px solid #854d0e;

  z-index:5;
}

/* =========================
   PLAYER
========================= */

#player{

  position:absolute;

  width:55px;
  height:70px;

  left:15%;
  bottom:60px;

  z-index:20;
}

.head{

  position:absolute;

  width:24px;
  height:24px;

  left:10px;
  top:0;

  background:#f1b07a;

  border:2px solid #222;

  border-radius:50%;
}

.hair{

  position:absolute;

  width:25px;
  height:9px;

  left:10px;
  top:0;

  background:#171717;

  border-radius:
    12px 12px 3px 3px;

  z-index:2;
}

.body{

  position:absolute;

  width:30px;
  height:30px;

  left:7px;
  top:27px;

  background:
    linear-gradient(
      #2563eb,
      #1e40af
    );

  border-radius:7px;
}

.armLeft,
.armRight{

  position:absolute;

  width:7px;
  height:24px;

  background:#f1b07a;

  border-radius:5px;

  z-index:4;
}

.armLeft{

  left:0;
  top:29px;

  transform:rotate(10deg);
}

.armRight{

  left:34px;
  top:29px;

  transform:rotate(-55deg);
}

.legLeft,
.legRight{

  position:absolute;

  width:9px;
  height:22px;

  top:54px;

  background:#171717;

  border-radius:4px;
}

.legLeft{
  left:10px;
}

.legRight{
  left:23px;
}

/* GUN */

.gun{

  position:absolute;

  width:34px;
  height:7px;

  left:29px;
  top:37px;

  background:#292929;

  border-radius:4px;

  z-index:8;
}

.gun:after{

  content:"";

  position:absolute;

  width:10px;
  height:5px;

  right:-8px;
  top:1px;

  background:#111;
}

.gunHandle{

  position:absolute;

  width:7px;
  height:13px;

  left:34px;
  top:42px;

  background:#171717;

  transform:rotate(20deg);

  z-index:8;
}

/* =========================
   ENEMY
========================= */

#enemy{

  position:absolute;

  width:50px;
  height:55px;

  left:80%;
  bottom:60px;

  z-index:19;

  background:
    linear-gradient(
      #991b1b,
      #450a0a
    );

  border:
    3px solid #1f0000;

  border-radius:
    45% 45% 35% 35%;

  box-shadow:
    0 0 15px red,
    inset 0 0 12px #000;

  transition:
    opacity .2s,
    transform .2s;
}

.hornLeft,
.hornRight{

  position:absolute;

  width:0;
  height:0;

  top:-20px;

  border-left:
    9px solid transparent;

  border-right:
    9px solid transparent;

  border-bottom:
    20px solid white;
}

.hornLeft{

  left:5px;

  transform:
    rotate(-15deg);
}

.hornRight{

  right:5px;

  transform:
    rotate(15deg);
}

.monsterEye{

  position:absolute;

  width:11px;
  height:8px;

  top:12px;

  background:#facc15;

  border:
    2px solid #111;

  box-shadow:
    0 0 8px red;
}

.eyeLeft{
  left:8px;
}

.eyeRight{
  right:8px;
}

.monsterMouth{

  position:absolute;

  left:8px;
  bottom:5px;

  width:28px;
  height:14px;

  background:#111;

  border-radius:
    0 0 15px 15px;

  border:2px solid #000;
}

.monsterMouth:after{

  content:"▼ ▼ ▼";

  position:absolute;

  left:1px;
  top:-3px;

  color:white;

  font-size:8px;
}

#enemy.dead{

  opacity:0;

  transform:
    scale(1.6)
    rotate(20deg);
}

/* =========================
   COIN
========================= */

#coin{

  position:absolute;

  width:28px;
  height:28px;

  left:45%;
  bottom:180px;

  background:#facc15;

  border:
    3px solid #a16207;

  border-radius:50%;

  z-index:15;

  box-shadow:
    0 0 15px #facc15;

  animation:
    coinSpin 1s linear infinite;
}

@keyframes coinSpin{

  50%{
    transform:rotateY(180deg);
  }

}

/* =========================
   BULLET
========================= */

#bullet{

  position:absolute;

  width:18px;
  height:7px;

  display:none;

  background:#fff7a8;

  border-radius:10px;

  z-index:50;

  box-shadow:
    0 0 12px yellow,
    0 0 20px orange;
}

/* =========================
   GAME OVER
========================= */

#gameOver{

  display:none;

  width:94%;

  max-width:520px;

  margin:10px auto;

  padding:15px;

  background:#7f1d1d;

  border-radius:15px;

  font-size:27px;

  font-weight:bold;
}

/* =========================
   CONTROLS
========================= */

.controls{

  width:94%;

  max-width:600px;

  margin:10px auto 25px;

  display:flex;

  justify-content:
    space-between;

  align-items:flex-start;
}

.controlSide{

  display:flex;

  flex-direction:column;

  gap:16px;
}

button{

  min-width:100px;

  padding:14px 10px;

  border:none;

  border-radius:14px;

  color:white;

  font-size:15px;

  font-weight:bold;

  background:
    linear-gradient(
      #3b82f6,
      #1d4ed8
    );

  box-shadow:
    0 4px 0 #172554;

  touch-action:manipulation;
}

button:active{

  transform:
    translateY(3px);

  box-shadow:
    0 1px 0 #172554;
}

#restartButton{

  position:fixed;

  left:50%;

  bottom:20px;

  transform:
    translateX(-50%);

  background:
    linear-gradient(
      #22c55e,
      #15803d
    );

  z-index:100;
}

/* SMALL PHONES */

@media(max-width:380px){

  h1{
    font-size:22px;
  }

  #info{
    font-size:13px;
  }

  #game{
    height:58vh;
    min-height:330px;
  }

  button{
    min-width:85px;
    padding:12px 8px;
    font-size:13px;
  }

  .tree4{
    display:none;
  }

}

/* LANDSCAPE */

@media(
  orientation:landscape
) and (max-height:500px){

  #game{

    height:72vh;

    min-height:280px;

    max-height:none;
  }

  h1{
    font-size:20px;
    margin:3px;
  }

  #info{
    padding:5px;
  }

  .controls{
    margin-top:5px;
  }

}

</style>
</head>


<body>

<h1>🎮 NAVAL GAME</h1>


<div id="info">

🏆 Score:
<span id="score">0</span>

&nbsp;&nbsp;

❤️
<span id="lives">3</span>

&nbsp;&nbsp;

| LV
<span id="level">1</span>

</div>


<div id="levelUp">
🔥 LEVEL UP! 🔥
</div>


<!-- GAME -->

<div id="game">

<div id="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>


<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>
<div class="mountain m4"></div>


<div class="tree tree1"></div>
<div class="tree tree2"></div>
<div class="tree tree3"></div>
<div class="tree tree4"></div>


<div class="bush bush1"></div>
<div class="bush bush2"></div>
<div class="bush bush3"></div>


<!-- PLAYER -->

<div id="player">

<div class="head"></div>

<div class="hair"></div>

<div class="body"></div>

<div class="armLeft"></div>

<div class="armRight"></div>

<div class="legLeft"></div>

<div class="legRight"></div>

<div class="gun"></div>

<div class="gunHandle"></div>

</div>


<!-- ENEMY -->

<div id="enemy">

<div class="hornLeft"></div>

<div class="hornRight"></div>

<div class="monsterEye eyeLeft"></div>

<div class="monsterEye eyeRight"></div>

<div class="monsterMouth"></div>

</div>


<!-- COIN -->

<div id="coin"></div>


<!-- BULLET -->

<div id="bullet"></div>


<div id="ground"></div>

</div>


<div id="gameOver">
GAME OVER 💀
</div>


<!-- CONTROLS -->

<div class="controls">


<div class="controlSide">

<button onclick="moveLeft()">
⬅️ LEFT
</button>

<button onclick="jump()">
⬆️ JUMP
</button>

</div>


<div class="controlSide">

<button onclick="moveRight()">
RIGHT ➡️
</button>

<button onclick="shoot()">
🔫 SHOOT
</button>

</div>


</div>


<button
id="restartButton"
onclick="restartGame()"
style="display:none;">

🔄 RESTART

</button>


<script>

/* =========================
   SOUND
========================= */

let audioCtx=null;


function startAudio(){

if(!audioCtx){

audioCtx=new(
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioCtx.state==="suspended"
){

audioCtx.resume();

}

}


function sound(type){

startAudio();

let osc=
audioCtx.createOscillator();

let gain=
audioCtx.createGain();

osc.connect(gain);

gain.connect(
audioCtx.destination
);

let now=
audioCtx.currentTime;


if(type==="shoot"){

osc.frequency
.setValueAtTime(
800,now
);

osc.frequency
.exponentialRampToValueAtTime(
150,
now+.12
);

gain.gain
.setValueAtTime(
.18,now
);

gain.gain
.exponentialRampToValueAtTime(
.01,
now+.12
);

osc.start();

osc.stop(
now+.12
);

}


if(type==="jump"){

osc.frequency
.setValueAtTime(
300,now
);

osc.frequency
.exponentialRampToValueAtTime(
650,
now+.18
);

gain.gain
.setValueAtTime(
.15,now
);

gain.gain
.exponentialRampToValueAtTime(
.01,
now+.18
);

osc.start();

osc.stop(
now+.18
);

}


if(type==="coin"){

osc.frequency
.setValueAtTime(
600,now
);

osc.frequency
.setValueAtTime(
900,
now+.08
);

gain.gain
.setValueAtTime(
.15,now
);

gain.gain
.exponentialRampToValueAtTime(
.01,
now+.18
);

osc.start();

osc.stop(
now+.18
);

}


if(type==="hit"){

osc.type="sawtooth";

osc.frequency
.setValueAtTime(
200,now
);

osc.frequency
.exponentialRampToValueAtTime(
60,
now+.2
);

gain.gain
.setValueAtTime(
.2,now
);

gain.gain
.exponentialRampToValueAtTime(
.01,
now+.2
);

osc.start();

osc.stop(
now+.2
);

}


if(type==="level"){

osc.frequency
.setValueAtTime(
500,now
);

osc.frequency
.setValueAtTime(
700,
now+.1
);

osc.frequency
.setValueAtTime(
1000,
now+.2
);

gain.gain
.setValueAtTime(
.15,now
);

gain.gain
.exponentialRampToValueAtTime(
.01,
now+.35
);

osc.start();

osc.stop(
now+.35
);

}


if(type==="gameover"){

osc.type="sawtooth";

osc.frequency
.setValueAtTime(
500,now
);

osc.frequency
.exponentialRampToValueAtTime(
80,
now+.5
);

gain.gain
.setValueAtTime(
.18,now
);

gain.gain
.exponentialRampToValueAtTime(
.01,
now+.5
);

osc.start();

osc.stop(
now+.5
);

}

}


/* =========================
   ELEMENTS
========================= */

const game=
document.getElementById(
"game"
);

const player=
document.getElementById(
"player"
);

const enemy=
document.getElementById(
"enemy"
);

const bullet=
document.getElementById(
"bullet"
);

const coin=
document.getElementById(
"coin"
);

const scoreText=
document.getElementById(
"score"
);

const livesText=
document.getElementById(
"lives"
);

const levelText=
document.getElementById(
"level"
);

const levelUpText=
document.getElementById(
"levelUp"
);

const gameOverText=
document.getElementById(
"gameOver"
);

const restartButton=
document.getElementById(
"restartButton"
);


/* =========================
   VARIABLES
========================= */

let x=0;

let enemyX=0;

let score=0;

let lives=3;

let level=1;

let enemySpeed=2;

let jumping=false;

let gameRunning=true;

let enemyDead=false;

let shooting=false;


/* =========================
   WIDTH
========================= */

function gameWidth(){

return game.clientWidth;

}


/* =========================
   START PLAYER
========================= */

function setPlayerStart(){

x=
Math.max(
10,
gameWidth()*0.15
);

player.style.left=
x+"px";

}


/* =========================
   LEFT
========================= */

function moveLeft(){

if(!gameRunning)
return;

startAudio();

x-=12;

if(x<0)
x=0;

player.style.left=
x+"px";

checkCoin();

}


/* =========================
   RIGHT
========================= */

function moveRight(){

if(!gameRunning)
return;

startAudio();

x+=12;

let maxX=
gameWidth()-60;

if(x>maxX)
x=maxX;

player.style.left=
x+"px";

checkCoin();

}


/* =========================
   JUMP
========================= */

function jump(){

if(
!gameRunning ||
jumping
)
return;

sound("jump");

jumping=true;

let height=0;


let up=
setInterval(function(){

height+=6;

player.style.bottom=
(60+height)+"px";

checkCoin();


if(height>=120){

clearInterval(up);


let down=
setInterval(function(){

height-=6;

player.style.bottom=
(60+height)+"px";

checkCoin();


if(height<=0){

clearInterval(down);

player.style.bottom=
"60px";

jumping=false;

}

},20);

}

},20);

}


/* =========================
   ENEMY SPAWN
========================= */

function spawnEnemy(){

enemyDead=false;

enemy.classList.remove(
"dead"
);


enemyX=
gameWidth()-58;


enemy.style.left=
enemyX+"px";


let colors=[

["#991b1b","#450a0a"],

["#7e22ce","#3b0764"],

["#0369a1","#082f49"],

["#15803d","#052e16"]

];


let c=
colors[
Math.floor(
Math.random()*
colors.length
)
];


enemy.style.background=
"linear-gradient("+
c[0]+","+
c[1]+")";

}


/* =========================
   ENEMY LOOP
========================= */

setInterval(function(){

if(
!gameRunning ||
enemyDead
)
return;


enemyX-=enemySpeed;


enemy.style.left=
enemyX+"px";


if(enemyX<-60){

score++;

scoreText.innerText=
score;

checkLevel();

spawnEnemy();

}


/* COLLISION */

if(
enemyX<x+45 &&
enemyX+50>x &&
!jumping
){

lives--;

livesText.innerText=
lives;


if(lives<=0){

gameRunning=false;

sound("gameover");

gameOverText.style.display=
"block";

restartButton.style.display=
"block";

}else{

spawnEnemy();

}

}

},30);


/* =========================
   LEVEL
========================= */

function checkLevel(){

let newLevel=
Math.floor(
score/5
)+1;


if(newLevel>level){

level=newLevel;

enemySpeed=
2+(level-1);

levelText.innerText=
level;

sound("level");

levelUpText.style.display=
"block";


setTimeout(function(){

levelUpText.style.display=
"none";

},1000);

}

}


/* =========================
   COIN
========================= */

let coinX=0;

let coinY=190;


function checkCoin(){

let playerBottom=
parseInt(
player.style.bottom
)||60;


if(
Math.abs(
x-coinX
)<45 &&

Math.abs(
playerBottom-coinY
)<45
){

score++;

scoreText.innerText=
score;

sound("coin");

checkLevel();


coinX=
Math.floor(
Math.random()*
Math.max(
1,
gameWidth()-30
)
);


coinY=
Math.floor(
Math.random()*180
)+80;


coin.style.left=
coinX+"px";

coin.style.bottom=
coinY+"px";

}

}


/* =========================
   SHOOT
========================= */

function shoot(){

if(
!gameRunning ||
enemyDead ||
shooting
)
return;


shooting=true;

sound("shoot");


let bulletX=
x+58;


let bulletY=
parseInt(
player.style.bottom
)+32;


bullet.style.left=
bulletX+"px";

bullet.style.bottom=
bulletY+"px";

bullet.style.display=
"block";


let timer=
setInterval(function(){

if(!gameRunning){

clearInterval(timer);

bullet.style.display=
"none";

shooting=false;

return;

}


bulletX+=12;


bullet.style.left=
bulletX+"px";


/* HIT */

if(
bulletX+18>=enemyX &&
bulletX<=enemyX+50
){

clearInterval(timer);

bullet.style.display=
"none";

shooting=false;

enemyDead=true;

sound("hit");

enemy.classList.add(
"dead"
);

score++;

scoreText.innerText=
score;

checkLevel();


setTimeout(function(){

if(gameRunning){

spawnEnemy();

}

},500);


return;

}


/* OUT */

if(
bulletX>
gameWidth()
){

clearInterval(timer);

bullet.style.display=
"none";

shooting=false;

}

},20);

}


/* =========================
   RESTART
========================= */

function restartGame(){

startAudio();

score=0;

lives=3;

level=1;

enemySpeed=2;

jumping=false;

gameRunning=true;

enemyDead=false;

shooting=false;


scoreText.innerText=
"0";

livesText.innerText=
"3";

levelText.innerText=
"1";


gameOverText.style.display=
"none";

levelUpText.style.display=
"none";

restartButton.style.display=
"none";

bullet.style.display=
"none";


player.style.bottom=
"60px";


setPlayerStart();


coinX=
Math.floor(
gameWidth()/2
);

coinY=190;


coin.style.left=
coinX+"px";

coin.style.bottom=
coinY+"px";


spawnEnemy();

}


/* =========================
   START
========================= */

setPlayerStart();

coinX=
Math.floor(
gameWidth()/2
);

coin.style.left=
coinX+"px";

coin.style.bottom=
coinY+"px";

spawnEnemy();


/* =========================
   SCREEN ROTATION / RESIZE
========================= */

window.addEventListener(
"resize",
function(){

if(!gameRunning)
return;

let maxX=
gameWidth()-60;

if(x>maxX)
x=maxX;

player.style.left=
x+"px";

});

</script>
