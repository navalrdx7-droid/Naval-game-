<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAVAL AI VIDEO EDITOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0d;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#171717;border-bottom:1px solid #333}
h1{margin:0;font-size:25px} header p{color:#aaa;margin:7px 0 0}
.container{max-width:700px;margin:auto;padding:15px}
.card{background:#1b1b1b;padding:16px;border-radius:16px;margin-bottom:15px}
label{display:block;color:#bbb;margin:12px 0 7px}
input[type=file],input[type=text],input[type=number],select{width:100%;padding:13px;border:0;border-radius:10px;background:#292929;color:#fff;margin-bottom:10px}
input[type=range]{width:100%;accent-color:#00d9ff}
button{width:100%;padding:14px;border:0;border-radius:11px;margin-top:9px;background:#00d9ff;color:#000;font-size:16px;font-weight:bold}
.row{display:flex;gap:10px}.row button{flex:1}
video{width:100%;background:#000;border-radius:12px;max-height:420px}
audio{width:100%}.value{color:#00d9ff;font-weight:bold}
#status{text-align:center;color:#00e5ff;min-height:22px}
#download{display:none;width:100%;padding:14px;margin-top:10px;border-radius:11px;background:#20d46b;color:#000;text-align:center;text-decoration:none;font-weight:bold}
#canvas{display:none}
</style>
</head>
<body>
<header><h1>⚡ NAVAL AI VIDEO EDITOR</h1><p>Mobile Video Editing Studio</p></header>

<div class="container">

<div class="card">
<label>🎬 Video Select करो</label>
<input id="videoFile" type="file" accept="video/*">
<video id="video" controls playsinline></video>
<p id="status">Video select करो</p>
</div>

<div class="card">
<label>✍️ Video Text</label>
<input id="textInput" type="text" placeholder="NAVAL GAMING 🔥">

<label>🎨 Filter</label>
<select id="filter">
<option value="none">Normal</option>
<option value="grayscale(100%)">Black & White</option>
<option value="sepia(100%)">Sepia</option>
<option value="contrast(150%)">High Contrast</option>
<option value="brightness(130%)">Bright</option>
<option value="saturate(180%)">Color Boost</option>
</select>

<label>⚡ Speed</label>
<select id="speed">
<option value="0.5">0.5x</option>
<option value="1" selected>1x Normal</option>
<option value="1.5">1.5x</option>
<option value="2">2x</option>
</select>

<label>🔄 Rotate</label>
<select id="rotate">
<option value="0">0°</option>
<option value="90">90°</option>
<option value="180">180°</option>
<option value="270">270°</option>
</select>

<label>✍️ Text Size</label>
<select id="textSize">
<option value="small">Small</option>
<option value="medium" selected>Medium</option>
<option value="large">Large</option>
</select>

<label>📍 Text Position</label>
<select id="textPosition">
<option value="top">Top</option>
<option value="center" selected>Center</option>
<option value="bottom">Bottom</option>
</select>
</div>

<div class="card">
<label>🎵 Background Music</label>
<input id="musicFile" type="file" accept="audio/*">
<audio id="music" controls></audio>

<label>🔊 Video Sound: <span id="videoVolText" class="value">100%</span></label>
<input id="videoVolume" type="range" min="0" max="1" step="0.01" value="1">

<label>🎵 Background Music: <span id="musicVolText" class="value">30%</span></label>
<input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.3">
</div>

<div class="card">
<label>✂️ Start Time (seconds)</label>
<input id="start" type="number" value="0" min="0" step="0.1">

<label>⏱️ End Time (seconds)</label>
<input id="end" type="number" value="10" min="0" step="0.1">

<div class="row">
<button onclick="setStart()">START</button>
<button onclick="setEnd()">END</button>
</div>
</div>

<div class="card">
<button onclick="playEdit()">▶️ PLAY EDIT</button>
<button onclick="exportVideo()">🎬 CREATE EDITED VIDEO</button>
<a id="download">⬇️ DOWNLOAD EDITED VIDEO</a>
<button onclick="resetVideo()">🔄 RESET</button>
</div>

<canvas id="canvas"></canvas>
</div>

<script>
const video=document.getElementById("video");
const music=document.getElementById("music");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");

document.getElementById("videoFile").addEventListener("change",function(){
  const file=this.files[0]; if(!file)return;
  video.src=URL.createObjectURL(file);
  video.onloadedmetadata=()=>{
    document.getElementById("end").value=video.duration.toFixed(1);
    statusText.innerText="✅ Video loaded";
  };
});

document.getElementById("musicFile").addEventListener("change",function(){
  const file=this.files[0]; if(!file)return;
  music.src=URL.createObjectURL(file);
});

document.getElementById("videoVolume").addEventListener("input",function(){
  video.volume=Number(this.value);
  document.getElementById("videoVolText").innerText=Math.round(this.value*100)+"%";
});

document.getElementById("musicVolume").addEventListener("input",function(){
  music.volume=Number(this.value);
  document.getElementById("musicVolText").innerText=Math.round(this.value*100)+"%";
});

document.getElementById("speed").addEventListener("change",function(){
  video.playbackRate=Number(this.value);
});

function setStart(){video.currentTime=Number(document.getElementById("start").value)||0}
function setEnd(){document.getElementById("end").value=video.currentTime.toFixed(1)}

function playEdit(){
  if(!video.src){alert("पहले video select करो");return}
  const start=Number(document.getElementById("start").value);
  const end=Number(document.getElementById("end").value);
  video.currentTime=start;
  video.playbackRate=Number(document.getElementById("speed").value);
  video.play();
  if(music.src){music.currentTime=0;music.volume=Number(document.getElementById("musicVolume").value);music.play().catch(()=>{})}
  const timer=setInterval(()=>{
    if(video.currentTime>=end){
      video.pause(); if(music.src)music.pause(); clearInterval(timer);
      statusText.innerText="✅ Preview complete";
    }
  },100);
}

function resetVideo(){
  video.pause(); if(music.src)music.pause();
  video.currentTime=0; video.playbackRate=1;
  document.getElementById("start").value=0;
  if(video.duration)document.getElementById("end").value=video.duration.toFixed(1);
  document.getElementById("speed").value="1";
  document.getElementById("rotate").value="0";
  document.getElementById("textInput").value="";
  document.getElementById("textSize").value="medium";
  document.getElementById("textPosition").value="center";
  statusText.innerText="🔄 Reset complete";
}

async function exportVideo(){
  if(!video.src){alert("पहले video select करो");return}

  const start=Number(document.getElementById("start").value);
  const end=Number(document.getElementById("end").value);
  const speed=Number(document.getElementById("speed").value);
  const rotation=Number(document.getElementById("rotate").value);
  const filter=document.getElementById("filter").value;
  const text=document.getElementById("textInput").value;
  const textSize=document.getElementById("textSize").value;
  const textPosition=document.getElementById("textPosition").value;
  const videoVol=Number(document.getElementById("videoVolume").value);
  const musicVol=Number(document.getElementById("musicVolume").value);

  if(end<=start){alert("End time Start time से बड़ा होना चाहिए");return}

  statusText.innerText="⏳ Video तैयार हो रहा है...";

  const w=video.videoWidth||720, h=video.videoHeight||1280;
  if(rotation===90||rotation===270){canvas.width=h;canvas.height=w}
  else{canvas.width=w;canvas.height=h}

  const canvasStream=canvas.captureStream(30);

  let audioContext, destination;
  try{
    audioContext=new (window.AudioContext||window.webkitAudioContext)();
    destination=audioContext.createMediaStreamDestination();

    const videoSource=audioContext.createMediaElementSource(video);
    const videoGain=audioContext.createGain();
    videoGain.gain.value=videoVol;
    videoSource.connect(videoGain);
    videoGain.connect(destination);
    videoGain.connect(audioContext.destination);

    if(music.src){
      const musicSource=audioContext.createMediaElementSource(music);
      const musicGain=audioContext.createGain();
      musicGain.gain.value=musicVol;
      musicSource.connect(musicGain);
      musicGain.connect(destination);
    }
    await audioContext.resume();
  }catch(e){
    console.log(e);
  }

  const finalStream=new MediaStream();
  canvasStream.getVideoTracks().forEach(t=>finalStream.addTrack(t));
  if(destination)destination.stream.getAudioTracks().forEach(t=>finalStream.addTrack(t));

  const mimeTypes=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  const mime=mimeTypes.find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){alert("इस browser में video export supported नहीं है");return}

  const recorder=new MediaRecorder(finalStream,{mimeType:mime});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};

  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    const download=document.getElementById("download");
    download.href=url;
    download.download="naval-edited-video.webm";
    download.style.display="block";
    statusText.innerText="✅ Video + Audio तैयार है!";
    if(audioContext)audioContext.close().catch(()=>{});
  };

  video.currentTime=start;
  video.playbackRate=speed;

  await new Promise(resolve=>{
    const fn=()=>{video.removeEventListener("seeked",fn);resolve()};
    video.addEventListener("seeked",fn);
  });

  if(music.src){music.currentTime=0;music.volume=musicVol}

  recorder.start();
  video.play();
  if(music.src)music.play().catch(()=>{});

  function draw(){
    if(video.paused || video.currentTime>=end){
      video.pause(); if(music.src)music.pause(); recorder.stop(); return;
    }

    ctx.save();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.filter=filter;

    if(rotation===90){
      ctx.translate(canvas.width,0);ctx.rotate(Math.PI/2);
      ctx.drawImage(video,0,0,w,h);
    }else if(rotation===180){
      ctx.translate(canvas.width,canvas.height);ctx.rotate(Math.PI);
      ctx.drawImage(video,0,0,w,h);
    }else if(rotation===270){
      ctx.translate(0,canvas.height);ctx.rotate(-Math.PI/2);
      ctx.drawImage(video,0,0,w,h);
    }else{
      ctx.drawImage(video,0,0,w,h);
    }
    ctx.restore();

    if(text){
      let size=canvas.width/18;
      if(textSize==="small")size=canvas.width/28;
      if(textSize==="large")size=canvas.width/12;

      let y=canvas.height-60;
      if(textPosition==="top")y=size+30;
      if(textPosition==="center")y=canvas.height/2;
      if(textPosition==="bottom")y=canvas.height-60;

      ctx.font=size+"px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.lineWidth=Math.max(4,size/8);
      ctx.strokeStyle="black";
      ctx.strokeText(text,canvas.width/2,y);
      ctx.fillStyle="white";
      ctx.fillText(text,canvas.width/2,y);
    }

    requestAnimationFrame(draw);
  }
  draw();
}
</script>
</body>
  </html>
