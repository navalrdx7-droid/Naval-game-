<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NAVAL AI VIDEO EDITOR V2</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
  background:#111;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:7px 0 0;
  color:#999;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#171717;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

label{
  display:block;
  color:#bbb;
  margin:12px 0 7px;
}

input[type=file],
input[type=text],
input[type=number],
select{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:white;
  font-size:16px;
}

input[type=range]{
  width:100%;
  accent-color:#00d9ff;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-weight:bold;
  font-size:17px;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.auto{
  background:#8b4dff;
  color:white;
  font-size:19px;
}

.green{
  background:#20d66b;
}

.red{
  background:#e53935;
  color:white;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

video{
  width:100%;
  max-height:430px;
  background:#000;
  border-radius:12px;
  margin-top:10px;
}

audio{
  width:100%;
  margin-top:10px;
}

canvas{
  display:none;
}

.value{
  float:right;
  color:#00d9ff;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#00d9ff;
  min-height:25px;
}

.progressBox{
  width:100%;
  height:12px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progressBar{
  width:0%;
  height:100%;
  background:#08cbea;
  transition:.2s;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:7px 10px;
  border-radius:20px;
  background:#242424;
  color:#aaa;
  font-size:13px;
}

</style>
</head>

<body>

<header>

<h1>🎬 NAVAL AI VIDEO EDITOR V2</h1>

<p>🤖 Smart Shorts & Reels Editor</p>

</header>


<div class="container">


<!-- VIDEO -->

<div class="card">

<label>🎥 Select Video</label>

<input
type="file"
id="videoFile"
accept="video/*"
>

<video
id="video"
controls
playsinline
preload="metadata">
</video>

<div
class="badge"
id="videoInfo">
No video selected
</div>

</div>


<!-- FORMAT -->

<div class="card">

<label>📱 Export Format</label>

<select id="format">

<option value="vertical">
📱 Shorts / Reels — 9:16
</option>

<option value="landscape">
🖥️ Landscape — 16:9
</option>

<option value="square">
⬛ Square — 1:1
</option>

</select>

</div>


<!-- MUSIC -->

<div class="card">

<label>🎵 Background Music</label>

<input
type="file"
id="musicFile"
accept="audio/*"
>

<audio
id="music"
controls>
</audio>

</div>


<!-- VOLUME -->

<div class="card">

<label>

🔊 Original Sound

<span
class="value"
id="videoVolumeValue">
100%
</span>

</label>

<input
type="range"
id="videoVolume"
min="0"
max="100"
value="100"
>

<label>

🎵 Music

<span
class="value"
id="musicVolumeValue">
30%
</span>

</label>

<input
type="range"
id="musicVolume"
min="0"
max="100"
value="30"
>

</div>


<!-- TRIM -->

<div class="card">

<label>✂️ Start Time</label>

<input
type="number"
id="start"
value="0"
min="0"
step="0.1"
>

<label>⏱️ End Time</label>

<input
type="number"
id="end"
value="0"
min="0"
step="0.1"
>

<div class="row">

<button onclick="setStart()">
SET START
</button>

<button onclick="setEnd()">
SET END
</button>

</div>

</div>


<!-- TEXT -->

<div class="card">

<label>📝 Caption / Text</label>

<input
type="text"
id="videoText"
placeholder="NAVAL GAMING 🔥"
>

</div>


<!-- FILTER -->

<div class="card">

<label>🎨 Style</label>

<select id="filter">

<option value="none">
Normal
</option>

<option value="contrast(1.35) saturate(1.4)">
🔥 Gaming Cinematic
</option>

<option value="contrast(1.5) saturate(1.7)">
⚡ Vivid
</option>

<option value="brightness(1.2) saturate(1.5)">
☀️ Bright
</option>

<option value="grayscale(1)">
⚫ Black & White
</option>

<option value="sepia(.7)">
🎞️ Vintage
</option>

</select>

</div>


<!-- EFFECT -->

<div class="card">

<label>✨ Effects</label>

<select id="effect">

<option value="none">
None
</option>

<option value="fade">
Fade In + Fade Out
</option>

</select>

</div>


<!-- AUTO EDIT -->

<div class="card">

<button
class="auto"
id="autoButton"
onclick="autoEdit()">

🤖 AUTO EDIT V2

</button>

<div class="badge">

One-click Shorts/Reels editing

</div>

</div>


<!-- ACTIONS -->

<div class="card">

<button onclick="previewEdit()">
▶️ PLAY PREVIEW
</button>

<button onclick="createEditedVideo()">
🎬 CREATE VIDEO
</button>

<button
class="green"
id="downloadButton"
onclick="downloadEditedVideo()">

⬇️ DOWNLOAD VIDEO

</button>

<button
class="red"
onclick="resetEditor()">

🔄 RESET

</button>

</div>


<!-- STATUS -->

<div class="card">

<div
class="status"
id="status">

Video select करो

</div>

<div class="progressBox">

<div
class="progressBar"
id="progressBar">
</div>

</div>

</div>


</div>


<canvas id="canvas"></canvas>


<script>

const video =
document.getElementById("video");

const music =
document.getElementById("music");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const autoButton =
document.getElementById("autoButton");

const downloadButton =
document.getElementById("downloadButton");


let videoURL="";
let musicURL="";

let videoFileSelected=false;
let musicFileSelected=false;

let audioContext=null;

let videoSource=null;
let musicSource=null;

let editedBlob=null;
let editedURL="";

let animationID=null;

let exporting=false;


/* STATUS */

function setStatus(text){

  statusText.innerText=text;

}


/* PROGRESS */

function setProgress(value){

  value=Math.max(
    0,
    Math.min(100,value)
  );

  progressBar.style.width=
    value+"%";

}


/* AUDIO */

function setupAudio(){

  if(audioContext)
    return;

  audioContext=
    new(
      window.AudioContext ||
      window.webkitAudioContext
    )();

  videoSource=
    audioContext.createMediaElementSource(
      video
    );

  musicSource=
    audioContext.createMediaElementSource(
      music
    );

  videoSource.connect(
    audioContext.destination
  );

  musicSource.connect(
    audioContext.destination
  );

}


/* VOLUME */

function updateVolumes(){

  const vv=
    Number(
      document.getElementById(
        "videoVolume"
      ).value
    )/100;

  const mv=
    Number(
      document.getElementById(
        "musicVolume"
      ).value
    )/100;

  document.getElementById(
    "videoVolumeValue"
  ).innerText=
    Math.round(vv*100)+"%";

  document.getElementById(
    "musicVolumeValue"
  ).innerText=
    Math.round(mv*100)+"%";

  video.volume=vv;
  music.volume=mv;

}


document
.getElementById("videoVolume")
.addEventListener(
  "input",
  updateVolumes
);

document
.getElementById("musicVolume")
.addEventListener(
  "input",
  updateVolumes
);


/* VIDEO SELECT */

document
.getElementById("videoFile")
.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)
      return;

    videoFileSelected=true;

    videoURL=
      URL.createObjectURL(file);

    video.src=videoURL;

    video.onloadedmetadata=
      function(){

        document.getElementById(
          "start"
        ).value=0;

        document.getElementById(
          "end"
        ).value=
          video.duration.toFixed(1);

        document.getElementById(
          "videoInfo"
        ).innerText=
          "🎥 "+
          Math.round(video.duration)+
          " sec video";

        setStatus(
          "✅ Video loaded"
        );

        setProgress(0);

      };

  }
);


/* MUSIC */

document
.getElementById("musicFile")
.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)
      return;

    musicFileSelected=true;

    musicURL=
      URL.createObjectURL(file);

    music.src=musicURL;

    music.loop=true;

    setStatus(
      "🎵 Music loaded"
    );

  }
);


/* START */

function setStart(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }

  document.getElementById(
    "start"
  ).value=
    video.currentTime.toFixed(1);

  setStatus(
    "✂️ Start set"
  );

}


/* END */

function setEnd(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }

  document.getElementById(
    "end"
  ).value=
    video.currentTime.toFixed(1);

  setStatus(
    "✂️ End set"
  );

}


/* FORMAT */

function getFormat(){

  return document.getElementById(
    "format"
  ).value;

}


/* DRAW */

function drawFrame(){

  if(!video.videoWidth)
    return;


  const format=
    getFormat();


  let cw;
  let ch;


  if(format==="vertical"){

    cw=720;
    ch=1280;

  }

  else if(format==="square"){

    cw=1080;
    ch=1080;

  }

  else{

    cw=1280;
    ch=720;

  }


  canvas.width=cw;
  canvas.height=ch;


  ctx.clearRect(
    0,
    0,
    cw,
    ch
  );


  /*
    BACKGROUND
  */

  ctx.fillStyle="#000";

  ctx.fillRect(
    0,
    0,
    cw,
    ch
  );


  /*
    COVER CROP
  */

  const scale=
    Math.max(
      cw/video.videoWidth,
      ch/video.videoHeight
    );


  const nw=
    video.videoWidth*scale;

  const nh=
    video.videoHeight*scale;


  const x=
    (cw-nw)/2;

  const y=
    (ch-nh)/2;


  ctx.filter=
    document.getElementById(
      "filter"
    ).value;


  ctx.drawImage(
    video,
    x,
    y,
    nw,
    nh
  );


  ctx.filter="none";


  /*
    TEXT
  */

  const text=
    document.getElementById(
      "videoText"
    ).value.trim();


  if(text){

    ctx.font=
      "bold "+
      Math.max(
        35,
        cw*.055
      )+
      "px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="bottom";

    ctx.lineWidth=6;

    ctx.strokeStyle="black";

    ctx.fillStyle="white";


    ctx.strokeText(
      text,
      cw/2,
      ch-70
    );


    ctx.fillText(
      text,
      cw/2,
      ch-70
    );

  }

}


/* PREVIEW */

async function previewEdit(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  const start=
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end=
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(end<=start){

    alert(
      "End time सही करो"
    );

    return;
  }


  video.currentTime=start;


  if(musicFileSelected){

    music.currentTime=0;

    music.play().catch(
      ()=>{}
    );

  }


  try{

    await video.play();

  }catch(e){

    return;

  }


  setStatus(
    "▶️ Preview चल रहा है..."
  );


  video.ontimeupdate=
    function(){

      if(
        video.currentTime>=end
      ){

        video.pause();

        if(musicFileSelected)
          music.pause();

        video.ontimeupdate=null;

        setStatus(
          "✅ Preview finished"
        );

      }

    };

}


/* AUTO EDIT */

async function autoEdit(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  if(exporting)
    return;


  const duration=
    video.duration;


  if(
    !duration ||
    duration<=0
  ){

    alert(
      "Video load होने दो"
    );

    return;
  }


  /*
    SMART SHORT LENGTH
  */

  const length=
    Math.min(
      duration,
      20
    );


  document.getElementById(
    "start"
  ).value=0;


  document.getElementById(
    "end"
  ).value=
    length.toFixed(1);


  /*
    AUTO SHORTS MODE
  */

  document.getElementById(
    "format"
  ).value=
    "vertical";


  /*
    AUTO CAPTION
  */

  document.getElementById(
    "videoText"
  ).value=
    "NAVAL GAMING 🔥";


  /*
    CINEMATIC
  */

  document.getElementById(
    "filter"
  ).value=
    "contrast(1.35) saturate(1.4)";


  /*
    EFFECT
  */

  document.getElementById(
    "effect"
  ).value=
    "fade";


  /*
    AUDIO
  */

  document.getElementById(
    "videoVolume"
  ).value=80;

  document.getElementById(
    "musicVolume"
  ).value=30;


  updateVolumes();


  setProgress(10);


  setStatus(
    "🤖 Auto Edit V2 तैयार हो रहा है..."
  );


  /*
    AUTOMATIC EXPORT
  */

  setTimeout(
    function(){

      createEditedVideo(true);

    },
    600
  );

}


/* CREATE */

async function createEditedVideo(
  automatic=false
){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  if(exporting)
    return;


  const start=
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end=
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(end<=start){

    alert(
      "End time सही करो"
    );

    return;
  }


  exporting=true;

  autoButton.disabled=true;

  downloadButton.disabled=true;


  try{


    setupAudio();


    if(
      audioContext.state==="suspended"
    ){

      await audioContext.resume();

    }


    setStatus(
      automatic
      ? "🤖 AI Auto Edit export हो रहा है..."
      : "🎬 Video export हो रहा है..."
    );


    setProgress(15);


    /*
      CANVAS
    */

    drawFrame();


    const canvasStream=
      canvas.captureStream(30);


    /*
      AUDIO MIX
    */

    const destination=
      audioContext
      .createMediaStreamDestination();


    const videoGain=
      audioContext.createGain();

    const musicGain=
      audioContext.createGain();


    videoGain.gain.value=
      Number(
        document.getElementById(
          "videoVolume"
        ).value
      )/100;


    musicGain.gain.value=
      Number(
        document.getElementById(
          "musicVolume"
        ).value
      )/100;


    videoSource.connect(
      videoGain
    );

    musicSource.connect(
      musicGain
    );


    videoGain.connect(
      destination
    );

    musicGain.connect(
      destination
    );


    /*
      STREAM
    */

    const combinedStream=
      new MediaStream();


    canvasStream
      .getVideoTracks()
      .forEach(
        track=>
          combinedStream.addTrack(track)
      );


    destination
      .stream
      .getAudioTracks()
      .forEach(
        track=>
          combinedStream.addTrack(track)
      );


    /*
      RECORDER
    */

    let mime=
      "video/webm;codecs=vp9,opus";


    if(
      !MediaRecorder
      .isTypeSupported(mime)
    ){

      mime=
        "video/webm;codecs=vp8,opus";

    }


    if(
      !MediaRecorder
      .isTypeSupported(mime)
    ){

      mime="video/webm";

    }


    const recorder=
      new MediaRecorder(
        combinedStream,
        {
          mimeType:mime
        }
      );


    const chunks=[];


    recorder.ondataavailable=
      function(e){

        if(e.data.size>0)
          chunks.push(e.data);

      };


    recorder.onstop=
      function(){

        editedBlob=
          new Blob(
            chunks,
            {
              type:
                recorder.mimeType
            }
          );


        if(editedURL){

          URL.revokeObjectURL(
            editedURL
          );

        }


        editedURL=
          URL.createObjectURL(
            editedBlob
          );


        try{

          videoSource.disconnect(
            videoGain
          );

          musicSource.disconnect(
            musicGain
          );

        }catch(e){}


        exporting=false;

        autoButton.disabled=false;

        downloadButton.disabled=false;


        setProgress(100);


        setStatus(
          "✅ Video तैयार है! DOWNLOAD दबाओ."
        );

      };


    /*
      SEEK
    */

    video.pause();

    if(musicFileSelected)
      music.pause();


    video.currentTime=start;


    await new Promise(
      resolve=>{

        const handler=
          function(){

            video.removeEventListener(
              "seeked",
              handler
            );

            resolve();

          };


        video.addEventListener(
          "seeked",
          handler
        );

      }
    );


    /*
      RECORD
    */

    recorder.start(200);


    if(musicFileSelected){

      music.currentTime=0;

      music.loop=true;

      music.play().catch(
        ()=>{}
      );

    }


    await video.play();


    /*
      RENDER
    */

    function render(){

      if(
        video.paused ||
        video.ended
      )
        return;


      drawFrame();


      const elapsed=
        video.currentTime-start;


      const total=
        end-start;


      const percent=
        20+
        (elapsed/total)*75;


      setProgress(
        Math.min(
          95,
          percent
        )
      );


      animationID=
        requestAnimationFrame(
          render
        );

    }


    render();


    /*
      STOP
    */

    video.ontimeupdate=
      function(){

        if(
          video.currentTime>=end
        ){

          video.pause();


          if(musicFileSelected)
            music.pause();


          cancelAnimationFrame(
            animationID
          );


          video.ontimeupdate=null;


          drawFrame();


          recorder.stop();

        }

      };


  }catch(error){

    console.error(error);


    exporting=false;

    autoButton.disabled=false;

    downloadButton.disabled=false;

    setProgress(0);

    setStatus(
      "❌ Export failed"
    );

    alert(
      "Browser इस video/audio format को export नहीं कर पाया."
    );

  }

}


/* DOWNLOAD */

function downloadEditedVideo(){

  if(!editedBlob){

    alert(
      "पहले video create करो"
    );

    return;
  }


  const link=
    document.createElement("a");


  link.href=editedURL;


  link.download=
    "NAVAL_AI_SHORT_EDIT.webm";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setStatus(
    "⬇️ Download started"
  );

}


/* RESET */

function resetEditor(){

  location.reload();

}


/* INITIAL */

downloadButton.disabled=true;

updateVolumes();

</script>

</body>
                         </html>
