<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NAVAL AI VIDEO EDITOR V8</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
  background:#151515;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  color:#999;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#181818;
  border-radius:17px;
  padding:18px;
  margin-bottom:15px;
}

label{
  display:block;
  color:#bbb;
  margin:12px 0 7px;
}

input[type=file],
input[type=text],
input[type=number],
select{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:white;

}

input[type=range]{
  width:100%;

}

button{
  width:100%;

  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.purple{
  background:#8b4dff;
  color:white;
}

.green{
  background:#20d66b;
}

.red{
  background:#e53935;
  color:white;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

video{
  width:100%;

  margin-top:15px;

canvas{

.badge{

}

.progressBox{
  width:100%;
  height:11px;
  margin-top:12px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
}

.progressBar{
  width:0%;
  height:100%;
  background:#08cbea;
  transition:.15s;
}

.downloadBox{
  display:none;
  margin-top:15px;
}

.notice{
  color:#999;
  font-size:13px;
  line-height:1.5;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>🎬 NAVAL AI VIDEO EDITOR V8</h1>
<p>Trim • Filter • Caption • Music • Export</p>
</header>

<div class="container">

<!-- VIDEO -->

<label>🎥 Select Video</label>

<input

</div>

<label>🎵 Background Music</label>

<input
  type="file"
  id="audioFile"
  accept="audio/*">

<audio
  id="audio"
  controls>
</audio>

<div
  class="badge"
  id="audioInfo">
  Audio select नहीं किया गया
</div>

</div>


<!-- FORMAT -->

<div class="card">

<label>📱 Output Format</label>

<select id="format">

<option value="vertical">
📱 Shorts / Reels — 9:16
</option>

<option value="landscape">
🖥️ YouTube — 16:9
</option>

<option value="square">
⬛ Square — 1:1
</option>

<!-- VOLUME -->

<div class="card">

<label>
🔊 Original Video

</span>
</label>

<input
  type="range"
  id="videoVolume"
  min="0"
  max="100"
  value="100">

<label>
🎵 Background Music
<span
  class="value"
  id="audioVolumeValue">
  30%
</span>
</label>

<input
  type="range"
  id="audioVolume"
  min="0"
  max="100"

</div>


<!-- TRIM -->

<div class="card">

<label>✂️ Start Time</label>

<input
  type="number"
  id="start"
  value="0"
  min="0"

<label>⏱️ End Time</label>

<input
  type="number"
  id="end"
  value="0"
  min="0"
  step="0.1">

<div class="row">

<button onclick="setStart()">
SET START
</button>

<label>📝 Caption / Text</label>

<input

<label>🎨 Editing Filter</label>

<select id="filter">

<option value="none">
Normal

</option>

<option value="contrast(1.5) saturate(1.7)">
⚡ Vivid
</option>

<option value="brightness(1.2) saturate(1.5)">
☀️ Bright
</option>

<option value="grayscale(1)">
⚫ Black & White
</option>

<option value="sepia(.7)">
🎞️ Vintage
</option>

<option value="contrast(1.25) brightness(1.08) saturate(1.25)">
🎬 Movie
</option>

</select>

<button
  class="purple"
  id="smartButton"

</div>

</div>


<!-- PREVIEW -->

<button onclick="previewEdit()">
▶️ PLAY EDITED PREVIEW
</button>

</div>

<button
  id="exportButton"
  onclick="createEditedVideo()">

🎬 CREATE EDITED VIDEO

</button>

Export browser में WebM format में बनेगा।
</div>

<div
  class="downloadBox"
  id="downloadBox">

<button
  class="green"
  onclick="downloadEditedVideo()">

⬇️ DOWNLOAD EDITED VIDEO

</button>

</div>

</div>


<!-- RESET -->

<div class="card">

<button
  class="red"
  onclick="resetEditor()">

🔄 RESET ALL

</button>

</div>


<!-- STATUS -->

<div class="card">

<div
  class="status"
  id="status">

पहले Video select करो

</div>

<div class="progressBox">

<div
  class="progressBar"
  id="progressBar">
</div>

</div>

</div>

</div>


<canvas id="canvas"></canvas>


<script>

/* =========================
   ELEMENTS
========================= */

const video =
document.getElementById("video");

const audio =
document.getElementById("audio");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const videoFile =
document.getElementById("videoFile");

const audioFile =
document.getElementById("audioFile");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const videoInfo =
document.getElementById("videoInfo");

const audioInfo =
document.getElementById("audioInfo");

const exportButton =
document.getElementById("exportButton");

const smartButton =
document.getElementById("smartButton");

const downloadBox =
document.getElementById("downloadBox");


/* =========================
   VARIABLES
========================= */

let videoURL = null;
let audioURL = null;

let videoLoaded = false;
let audioLoaded = false;

let editedBlob = null;
let editedURL = null;

let exporting = false;
let animationID = null;


/* =========================
   STATUS
========================= */

function setStatus(text){

  statusText.innerText = text;

}


/* =========================
   PROGRESS
========================= */

function setProgress(value){

  value =
    Math.max(
      0,
      Math.min(100,value)
    );

  progressBar.style.width =
    value + "%";

}


/* =========================
   VIDEO LOAD
========================= */

videoFile.addEventListener(
"change",
function(){

  const file =
    this.files[0];

  if(!file)
    return;


  if(videoURL){

    URL.revokeObjectURL(
      videoURL
    );

  }


  videoURL =
    URL.createObjectURL(file);


  video.pause();

  video.src =
    videoURL;

  video.load();


  videoLoaded = true;


  videoInfo.innerText =
    "🎥 " + file.name;


  setStatus(
    "🎥 Video loading..."
  );


  video.onloadedmetadata =
    function(){

      document.getElementById(
        "start"
      ).value = "0";


      document.getElementById(
        "end"
      ).value =
        video.duration.toFixed(1);


      videoInfo.innerText =
        "✅ " +
        Math.round(video.duration) +
        " sec video";


      setStatus(
        "✅ Video ready"
      );


      setProgress(0);

    };

});


video.addEventListener(
"error",
function(){

  setStatus(
    "❌ Video load नहीं हो पाया"
  );

});


/* =========================
   AUDIO LOAD
========================= */

audioFile.addEventListener(
"change",
function(){

  const file =
    this.files[0];

  if(!file)
    return;


  if(audioURL){

    URL.revokeObjectURL(
      audioURL
    );

  }


  audioURL =
    URL.createObjectURL(file);


  audio.pause();

  audio.src =
    audioURL;

  audio.load();

  audio.loop = true;


  audioLoaded = true;


  audioInfo.innerText =
    "🎵 " + file.name;


  setStatus(
    "🎵 Audio ready"
  );

});


/* =========================
   VOLUME
========================= */

function updateVolumes(){

  const videoVolume =
    Number(
      document.getElementById(
        "videoVolume"
      ).value
    ) / 100;


  const audioVolume =
    Number(
      document.getElementById(
        "audioVolume"
      ).value
    ) / 100;


  video.volume =
    videoVolume;

  audio.volume =
    audioVolume;


  document.getElementById(
    "videoVolumeValue"
  ).innerText =
    Math.round(
      videoVolume * 100
    ) + "%";


  document.getElementById(
    "audioVolumeValue"
  ).innerText =
    Math.round(
      audioVolume * 100
    ) + "%";

}


document
.getElementById("videoVolume")
.addEventListener(
"input",
updateVolumes
);


document
.getElementById("audioVolume")
.addEventListener(
"input",
updateVolumes
);


/* =========================
   TRIM
========================= */

function setStart(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  document.getElementById(
    "start"
  ).value =
    video.currentTime.toFixed(1);


  setStatus(
    "✂️ Start time set"
  );

}


function setEnd(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  document.getElementById(
    "end"
  ).value =
    video.currentTime.toFixed(1);


  setStatus(
    "✂️ End time set"
  );

}


/* =========================
   FORMAT SIZE
========================= */

function getCanvasSize(){

  const format =
    document.getElementById(
      "format"
    ).value;


  if(format === "vertical"){

    return {
      width:720,
      height:1280
    };

  }


  if(format === "square"){

    return {
      width:1080,
      height:1080
    };

  }


  return {
    width:1280,
    height:720
  };

}


/* =========================
   DRAW FRAME
========================= */

function drawFrame(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;
  }


  const size =
    getCanvasSize();


  canvas.width =
    size.width;

  canvas.height =
    size.height;


  const cw =
    canvas.width;

  const ch =
    canvas.height;


  /*
    Background
  */

  ctx.fillStyle =
    "#000";

  ctx.fillRect(
    0,
    0,
    cw,
    ch
  );


  /*
    COVER CROP
  */

  const scale =
    Math.max(
      cw / video.videoWidth,
      ch / video.videoHeight
    );


  const nw =
    video.videoWidth * scale;


  const nh =
    video.videoHeight * scale;


  const x =
    (cw - nw) / 2;


  const y =
    (ch - nh) / 2;


  /*
    FILTER
  */

  ctx.filter =
    document.getElementById(
      "filter"
    ).value;


  ctx.drawImage(
    video,
    x,
    y,
    nw,
    nh
  );


  ctx.filter =
    "none";


  /*
    CAPTION
  */

  const text =
    document.getElementById(
      "videoText"
    ).value.trim();


  if(text){

    ctx.font =
      "bold " +
      Math.max(
        35,
        cw * 0.055
      ) +
      "px Arial";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "bottom";


    ctx.lineWidth =
      7;


    ctx.strokeStyle =
      "#000";


    ctx.fillStyle =
      "#fff";


    ctx.strokeText(
      text,
      cw / 2,
      ch - 70
    );


    ctx.fillText(
      text,
      cw / 2,
      ch - 70
    );

  }

}


/* =========================
   PREVIEW
========================= */

async function previewEdit(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(
    isNaN(start) ||
    isNaN(end) ||
    end <= start
  ){

    alert(
      "Start और End time सही करो"
    );

    return;
  }


  video.pause();
  audio.pause();


  video.currentTime =
    start;


  if(audioLoaded){

    audio.currentTime =
      0;

  }


  setProgress(0);


  try{

    await video.play();


    if(audioLoaded){

      audio.play().catch(
        ()=>{}
      );

    }


    setStatus(
      "▶️ Preview चल रहा है..."
    );

  }

  catch(error){

    setStatus(
      "❌ Video play नहीं हुआ"
    );

    return;

  }


  video.ontimeupdate =
    function(){

      const elapsed =
        video.currentTime -
        start;


      const total =
        end - start;


      setProgress(
        (elapsed / total) * 100
      );


      if(
        video.currentTime >= end
      ){

        video.pause();


        if(audioLoaded)
          audio.pause();


        video.ontimeupdate =
          null;


        setProgress(100);


        setStatus(
          "✅ Preview finished"
        );

      }

    };

}


/* =========================
   SMART SETTINGS
========================= */

function smartEdit(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  const duration =
    video.duration;


  let start = 0;


  let end =
    Math.min(
      duration,
      20
    );


  if(duration > 30){

    start =
      duration * 0.20;


    end =
      Math.min(
        duration,
        start + 20
      );

  }


  document.getElementById(
    "start"
  ).value =
    start.toFixed(1);


  document.getElementById(
    "end"
  ).value =
    end.toFixed(1);


  document.getElementById(
    "format"
  ).value =
    "vertical";


  document.getElementById(
    "videoText"
  ).value =
    "NAVAL GAMING 🔥";


  document.getElementById(
    "filter"
  ).value =
    "contrast(1.35) saturate(1.4)";


  document.getElementById(
    "videoVolume"
  ).value =
    "80";


  document.getElementById(
    "audioVolume"
  ).value =
    audioLoaded ? "25" : "0";


  updateVolumes();


  setStatus(
    "🧠 Smart settings apply हो गईं"
  );

}


/* =========================
   CREATE EDITED VIDEO
========================= */

async function createEditedVideo(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  if(exporting)
    return;


  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(
    isNaN(start) ||
    isNaN(end) ||
    end <= start
  ){

    alert(
      "Start और End time सही करो"
    );

    return;
  }


  if(
    !window.MediaRecorder ||
    !canvas.captureStream
  ){

    alert(
      "इस browser में video export support नहीं है."
    );

    return;
  }


  exporting = true;

  exportButton.disabled =
    true;

  smartButton.disabled =
    true;


  downloadBox.style.display =
    "none";


  setProgress(0);


  try{

    /*
      Prepare canvas
    */

    drawFrame();


    const canvasStream =
      canvas.captureStream(30);


    /*
      VIDEO ONLY STREAM

      यह सबसे stable mobile
      browser export method है.
    */

    const recorder =
      new MediaRecorder(
        canvasStream,
        {
          mimeType:
            getMimeType()
        }
      );


    const chunks = [];


    recorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size > 0
        ){

          chunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      function(){

        editedBlob =
          new Blob(
            chunks,
            {
              type:
                recorder.mimeType
            }
          );


        if(editedURL){

          URL.revokeObjectURL(
            editedURL
          );

        }


        editedURL =
          URL.createObjectURL(
            editedBlob
          );


        exporting = false;

        exportButton.disabled =
          false;

        smartButton.disabled =
          false;


        downloadBox.style.display =
          "block";


        setProgress(100);


        setStatus(
          "✅ Edited video तैयार है!"
        );

      };


    /*
      Stop playback
    */

    video.pause();
    audio.pause();


    /*
      Seek to start
    */

    video.currentTime =
      start;


    await waitForSeek();


    /*
      Start recorder
    */

    recorder.start(200);


    /*
      Play video
    */

    await video.play();


    /*
      Background music is
      previewed separately.
      It is NOT mixed into
      export in this stable V8.
    */

    if(audioLoaded){

      audio.currentTime =
        0;

      audio.play().catch(
        ()=>{}
      );

    }


    /*
      Render loop
    */

    function render(){

      if(
        video.paused ||
        video.ended
      ){

        return;
      }


      drawFrame();


      const elapsed =
        video.currentTime -
        start;


      const total =
        end -
        start;


      const percent =
        (
          elapsed /
          total
        ) * 100;


      setProgress(
        Math.min(
          95,
          percent
        )
      );


      animationID =
        requestAnimationFrame(
          render
        );

    }


    render();


    /*
      Stop at end
    */

    video.ontimeupdate =
      function(){

        if(
          video.currentTime >= end
        ){

          video.pause();


          if(audioLoaded)
            audio.pause();


          cancelAnimationFrame(
            animationID
          );


          video.ontimeupdate =
            null;


          drawFrame();


          recorder.stop();

        }

      };

  }

  catch(error){

    console.error(error);


    exporting = false;

    exportButton.disabled =
      false;

    smartButton.disabled =
      false;


    setProgress(0);


    setStatus(
      "❌ Export failed"
    );


    alert(
      "Export नहीं हो पाया। छोटी video से दोबारा try करो."
    );

  }

}


/* =========================
   MIME TYPE
========================= */

function getMimeType(){

  const types = [

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for(
    let i = 0;
    i < types.length;
    i++
  ){

    if(
      MediaRecorder
      .isTypeSupported(
        types[i]
      )
    ){

      return types[i];

    }

  }


  return "";

}


/* =========================
   WAIT FOR SEEK
========================= */

function waitForSeek(){

  return new Promise(
    function(resolve){

      if(
        Math.abs(
          video.currentTime -
          Number(
            document.getElementById(
              "start"
            ).value
          )
        ) < 0.05
      ){

        resolve();

        return;

      }


      const handler =
        function(){

          video.removeEventListener(
            "seeked",
            handler
          );

          resolve();

        };


      video.addEventListener(
        "seeked",
        handler
      );

    }
  );

}


/* =========================
   DOWNLOAD
========================= */

function downloadEditedVideo(){

  if(!editedBlob){

    alert(
      "पहले video create करो"
    );

    return;
  }


  const link =
    document.createElement(
      "a"
    );


  link.href =
    editedURL;


  link.download =
    "NAVAL_EDITED_VIDEO.webm";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();
