<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAVAL VIDEO EDITOR V6</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
  background:#151515;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  color:#aaa;
  margin:7px 0 0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#181818;
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;
}

label{
  display:block;
  color:#bbb;
  margin-bottom:8px;
}

input[type=file]{
  width:100%;
  padding:14px;
  background:#292929;
  color:white;
  border-radius:10px;
}

video{
  width:100%;
  margin-top:15px;
  background:#000;
  border-radius:12px;
  display:block;
}

audio{
  width:100%;
  margin-top:15px;
  display:block;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-size:17px;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#00d9ff;
  padding:10px;
  min-height:25px;
}

.info{
  color:#999;
  font-size:14px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>🎬 NAVAL VIDEO EDITOR V6</h1>
<p>Video + Audio Test</p>
</header>

<div class="container">

<!-- VIDEO -->

<div class="card">

<label>🎥 Video Select करो</label>

<input
  type="file"
  id="videoFile"
  accept="video/*">

<video
  id="video"
  controls
  playsinline
  preload="metadata">
</video>

<div class="info" id="videoInfo">
Video select नहीं किया गया
</div>

</div>


<!-- AUDIO -->

<div class="card">

<label>🎵 Audio Select करो</label>

<input
  type="file"
  id="audioFile"
  accept="audio/*">

<audio
  id="audio"
  controls>
</audio>

<div class="info" id="audioInfo">
Audio select नहीं किया गया
</div>

</div>


<!-- TEST -->

<div class="card">

<button onclick="playVideo()">
▶️ PLAY VIDEO
</button>

<button onclick="playAudio()">
🎵 PLAY AUDIO
</button>

<button onclick="stopAll()">
⏹️ STOP
</button>

</div>


<div class="card">

<div class="status" id="status">
पहले Video select करो
</div>

</div>

</div>


<script>

const video =
document.getElementById("video");

const audio =
document.getElementById("audio");

const videoFile =
document.getElementById("videoFile");

const audioFile =
document.getElementById("audioFile");

const status =
document.getElementById("status");

const videoInfo =
document.getElementById("videoInfo");

const audioInfo =
document.getElementById("audioInfo");

let videoURL = null;
let audioURL = null;


/* =====================
   VIDEO
===================== */

videoFile.addEventListener(
"change",
function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(videoURL){
    URL.revokeObjectURL(videoURL);
  }

  videoURL =
    URL.createObjectURL(file);

  video.pause();

  video.src = videoURL;

  video.load();

  videoInfo.innerText =
    "✅ " +
    file.name;

  status.innerText =
    "🎥 Video ready — Play दबाओ";

});


video.addEventListener(
"loadedmetadata",
function(){

  videoInfo.innerText =
    "✅ Video ready — " +
    Math.round(video.duration) +
    " seconds";

});


video.addEventListener(
"error",
function(){

  status.innerText =
    "❌ यह video format browser में support नहीं है";

});


/* =====================
   AUDIO
===================== */

audioFile.addEventListener(
"change",
function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(audioURL){
    URL.revokeObjectURL(audioURL);
  }

  audioURL =
    URL.createObjectURL(file);

  audio.pause();

  audio.src = audioURL;

  audio.load();

  audioInfo.innerText =
    "✅ " +
    file.name;

  status.innerText =
    "🎵 Audio ready — Play दबाओ";

});


audio.addEventListener(
"loadedmetadata",
function(){

  audioInfo.innerText =
    "✅ Audio ready";

});


audio.addEventListener(
"error",
function(){

  status.innerText =
    "❌ यह audio format browser में support नहीं है";

});


/* =====================
   PLAY VIDEO
===================== */

async function playVideo(){

  if(!video.src){

    alert(
      "पहले video select करो"
    );

    return;
  }

  try{

    await video.play();

    status.innerText =
      "▶️ Video चल रहा है";

  }catch(error){

    console.log(error);

    status.innerText =
      "❌ Video play नहीं हुआ";

  }

}


/* =====================
   PLAY AUDIO
===================== */

async function playAudio(){

  if(!audio.src){

    alert(
      "पहले audio select करो"
    );

    return;
  }

  try{

    await audio.play();

    status.innerText =
      "🎵 Audio चल रहा है";

  }catch(error){

    console.log(error);

    status.innerText =
      "❌ Audio play नहीं हुआ";

  }

}


/* =====================
   STOP
===================== */

function stopAll(){

  video.pause();
  audio.pause();

  video.currentTime = 0;
  audio.currentTime = 0;

  status.innerText =
    "⏹️ Stopped";

}

</script>

</body>
  </html>
