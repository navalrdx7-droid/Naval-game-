<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NAVAL AI VIDEO EDITOR V7</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
  background:#151515;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  color:#999;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#181818;
  border-radius:17px;
  padding:18px;
  margin-bottom:15px;
}

label{
  display:block;
  color:#bbb;
  margin:12px 0 7px;
}

input[type=file],
input[type=text],
input[type=number],
select{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:white;
  font-size:16px;
}

input[type=range]{
  width:100%;
  accent-color:#00d9ff;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.green{
  background:#20d66b;
}

.purple{
  background:#8b4dff;
  color:white;
}

.red{
  background:#e53935;
  color:white;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

video{
  width:100%;
  max-height:500px;
  margin-top:15px;
  background:#000;
  border-radius:12px;
  display:block;
}

audio{
  width:100%;
  margin-top:12px;
}

canvas{
  display:none;
}

.value{
  float:right;
  color:#00d9ff;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#00d9ff;
  min-height:25px;
  line-height:1.5;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:7px 10px;
  background:#292929;
  color:#aaa;
  border-radius:20px;
  font-size:13px;
}

.previewBox{
  margin-top:12px;
  padding:12px;
  background:#101010;
  border-radius:12px;
  color:#aaa;
  text-align:center;
}

.progressBox{
  width:100%;
  height:10px;
  margin-top:12px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
}

.progressBar{
  width:0%;
  height:100%;
  background:#08cbea;
  transition:.2s;
}
</style>
</head>

<body>

<header>
  <h1>🎬 NAVAL AI VIDEO EDITOR V7</h1>
  <p>Smart Mobile Video Editing Studio</p>
</header>

<div class="container">

<!-- VIDEO -->

<div class="card">

<label>🎥 Select Video</label>

<input
  type="file"
  id="videoFile"
  accept="video/*">

<video
  id="video"
  controls
  playsinline
  preload="metadata">
</video>

<div
  class="badge"
  id="videoInfo">
  Video select नहीं किया गया
</div>

</div>


<!-- AUDIO -->

<div class="card">

<label>🎵 Background Music</label>

<input
  type="file"
  id="audioFile"
  accept="audio/*">

<audio
  id="audio"
  controls>
</audio>

<div
  class="badge"
  id="audioInfo">
  Audio select नहीं किया गया
</div>

</div>


<!-- FORMAT -->

<div class="card">

<label>📱 Output Format</label>

<select id="format">

<option value="vertical">
📱 Shorts / Reels — 9:16
</option>

<option value="landscape">
🖥️ YouTube — 16:9
</option>

<option value="square">
⬛ Square — 1:1
</option>

</select>

<div class="previewBox" id="formatInfo">
Current: 9:16 Vertical
</div>

</div>


<!-- VOLUME -->

<div class="card">

<label>
🔊 Original Video
<span
  class="value"
  id="videoVolumeValue">
  100%
</span>
</label>

<input
  type="range"
  id="videoVolume"
  min="0"
  max="100"
  value="100">

<label>
🎵 Background Music
<span
  class="value"
  id="audioVolumeValue">
  30%
</span>
</label>

<input
  type="range"
  id="audioVolume"
  min="0"
  max="100"
  value="30">

</div>


<!-- TRIM -->

<div class="card">

<label>✂️ Start Time — seconds</label>

<input
  type="number"
  id="start"
  value="0"
  min="0"
  step="0.1">

<label>⏱️ End Time — seconds</label>

<input
  type="number"
  id="end"
  value="0"
  min="0"
  step="0.1">

<div class="row">

<button onclick="setStart()">
✂️ SET START
</button>

<button onclick="setEnd()">
✂️ SET END
</button>

</div>

<button onclick="resetTrim()">
↩️ RESET TRIM
</button>

</div>


<!-- TEXT -->

<div class="card">

<label>📝 Caption / Text</label>

<input
  type="text"
  id="videoText"
  placeholder="NAVAL GAMING 🔥">

</div>


<!-- FILTER -->

<div class="card">

<label>🎨 Editing Filter</label>

<select id="filter">

<option value="none">
Normal
</option>

<option value="contrast(1.35) saturate(1.4)">
🔥 Gaming Cinematic
</option>

<option value="contrast(1.5) saturate(1.7)">
⚡ Vivid
</option>

<option value="brightness(1.2) saturate(1.5)">
☀️ Bright
</option>

<option value="grayscale(1)">
⚫ Black & White
</option>

<option value="sepia(.7)">
🎞️ Vintage
</option>

<option value="contrast(1.25) brightness(1.08) saturate(1.25)">
🎬 Movie
</option>

</select>

</div>


<!-- SMART -->

<div class="card">

<button
  class="purple"
  onclick="smartEdit()">
🧠 SMART AUTO SETTINGS
</button>

</div>


<!-- ACTIONS -->

<div class="card">

<button onclick="previewEdit()">
▶️ PLAY EDITED PREVIEW
</button>

<button
  class="green"
  onclick="showEditInfo()">
✅ CHECK EDIT SETTINGS
</button>

<button onclick="resetEditor()">
🔄 RESET ALL
</button>

</div>


<!-- STATUS -->

<div class="card">

<div
  class="status"
  id="status">
पहले Video select करो
</div>

<div class="progressBox">

<div
  class="progressBar"
  id="progressBar">
</div>

</div>

</div>

</div>


<canvas id="canvas"></canvas>


<script>

/* =========================
   ELEMENTS
========================= */

const video =
document.getElementById("video");

const audio =
document.getElementById("audio");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const videoFile =
document.getElementById("videoFile");

const audioFile =
document.getElementById("audioFile");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const videoInfo =
document.getElementById("videoInfo");

const audioInfo =
document.getElementById("audioInfo");

const format =
document.getElementById("format");

const formatInfo =
document.getElementById("formatInfo");


/* =========================
   VARIABLES
========================= */

let videoURL = null;
let audioURL = null;

let videoLoaded = false;
let audioLoaded = false;


/* =========================
   STATUS
========================= */

function setStatus(text){

  statusText.innerText = text;

}


/* =========================
   PROGRESS
========================= */

function setProgress(value){

  value =
    Math.max(
      0,
      Math.min(100,value)
    );

  progressBar.style.width =
    value + "%";

}


/* =========================
   VIDEO LOAD
========================= */

videoFile.addEventListener(
"change",
function(){

  const file =
    this.files[0];

  if(!file)
    return;


  if(videoURL){

    URL.revokeObjectURL(
      videoURL
    );

  }


  videoURL =
    URL.createObjectURL(file);


  video.pause();

  video.src =
    videoURL;

  video.load();


  videoLoaded = true;


  videoInfo.innerText =
    "🎥 " +
    file.name;


  setStatus(
    "🎥 Video loading..."
  );


  video.onloadedmetadata =
    function(){

      document.getElementById(
        "start"
      ).value = "0";


      document.getElementById(
        "end"
      ).value =
        video.duration.toFixed(1);


      videoInfo.innerText =
        "✅ " +
        Math.round(
          video.duration
        ) +
        " sec video";


      setStatus(
        "✅ Video ready"
      );


      setProgress(0);

    };

});


/* =========================
   VIDEO ERROR
========================= */

video.addEventListener(
"error",
function(){

  setStatus(
    "❌ Video load नहीं हो पाया"
  );

});


/* =========================
   AUDIO LOAD
========================= */

audioFile.addEventListener(
"change",
function(){

  const file =
    this.files[0];

  if(!file)
    return;


  if(audioURL){

    URL.revokeObjectURL(
      audioURL
    );

  }


  audioURL =
    URL.createObjectURL(file);


  audio.pause();

  audio.src =
    audioURL;

  audio.load();


  audioLoaded = true;


  audioInfo.innerText =
    "🎵 " +
    file.name;


  setStatus(
    "🎵 Audio ready"
  );

});


/* =========================
   AUDIO ERROR
========================= */

audio.addEventListener(
"error",
function(){

  setStatus(
    "❌ Audio load नहीं हो पाया"
  );

});


/* =========================
   VOLUME
========================= */

function updateVolumes(){

  const videoVolume =
    Number(
      document.getElementById(
        "videoVolume"
      ).value
    ) / 100;


  const audioVolume =
    Number(
      document.getElementById(
        "audioVolume"
      ).value
    ) / 100;


  video.volume =
    videoVolume;

  audio.volume =
    audioVolume;


  document.getElementById(
    "videoVolumeValue"
  ).innerText =
    Math.round(
      videoVolume * 100
    ) + "%";


  document.getElementById(
    "audioVolumeValue"
  ).innerText =
    Math.round(
      audioVolume * 100
    ) + "%";

}


document
.getElementById("videoVolume")
.addEventListener(
"input",
updateVolumes
);


document
.getElementById("audioVolume")
.addEventListener(
"input",
updateVolumes
);


/* =========================
   FORMAT
========================= */

format.addEventListener(
"change",
updateFormatInfo
);


function updateFormatInfo(){

  if(format.value === "vertical"){

    formatInfo.innerText =
      "Current: 📱 9:16 Vertical — Shorts/Reels";

  }

  else if(format.value === "landscape"){

    formatInfo.innerText =
      "Current: 🖥️ 16:9 Landscape — YouTube";

  }

  else{

    formatInfo.innerText =
      "Current: ⬛ 1:1 Square";

  }

}


/* =========================
   SET START
========================= */

function setStart(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  document.getElementById(
    "start"
  ).value =
    video.currentTime.toFixed(1);


  setStatus(
    "✂️ Start time set"
  );

}


/* =========================
   SET END
========================= */

function setEnd(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  document.getElementById(
    "end"
  ).value =
    video.currentTime.toFixed(1);


  setStatus(
    "✂️ End time set"
  );

}


/* =========================
   RESET TRIM
========================= */

function resetTrim(){

  if(!videoLoaded)
    return;


  document.getElementById(
    "start"
  ).value =
    "0";


  document.getElementById(
    "end"
  ).value =
    video.duration.toFixed(1);


  setStatus(
    "↩️ Trim reset"
  );

}


/* =========================
   DRAW EDITED FRAME
========================= */

function drawEditedFrame(){

  if(!videoLoaded ||
     !video.videoWidth){

    return;

  }


  let width;
  let height;


  if(format.value === "vertical"){

    width = 720;
    height = 1280;

  }

  else if(format.value === "square"){

    width = 1080;
    height = 1080;

  }

  else{

    width = 1280;
    height = 720;

  }


  canvas.width =
    width;

  canvas.height =
    height;


  /*
    Background
  */

  ctx.fillStyle =
    "#000";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /*
    Cover crop
  */

  const scale =
    Math.max(
      width / video.videoWidth,
      height / video.videoHeight
    );


  const newWidth =
    video.videoWidth *
    scale;


  const newHeight =
    video.videoHeight *
    scale;


  const x =
    (width - newWidth) / 2;


  const y =
    (height - newHeight) / 2;


  /*
    Filter
  */

  ctx.filter =
    document.getElementById(
      "filter"
    ).value;


  ctx.drawImage(
    video,
    x,
    y,
    newWidth,
    newHeight
  );


  ctx.filter =
    "none";


  /*
    Caption
  */

  const text =
    document.getElementById(
      "videoText"
    ).value.trim();


  if(text){

    ctx.font =
      "bold " +
      Math.max(
        35,
        width * .055
      ) +
      "px Arial";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "bottom";


    ctx.lineWidth =
      6;


    ctx.strokeStyle =
      "#000";


    ctx.fillStyle =
      "#fff";


    ctx.strokeText(
      text,
      width / 2,
      height - 70
    );


    ctx.fillText(
      text,
      width / 2,
      height - 70
    );

  }

}


/* =========================
   PREVIEW
========================= */

async function previewEdit(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(
    isNaN(start) ||
    isNaN(end) ||
    end <= start
  ){

    alert(
      "Start और End time सही करो"
    );

    return;
  }


  if(start < 0 ||
     end > video.duration){

    alert(
      "Time video की सीमा के अंदर रखो"
    );

    return;
  }


  video.pause();

  audio.pause();


  video.currentTime =
    start;


  if(audioLoaded){

    audio.currentTime =
      0;

  }


  setStatus(
    "▶️ Edited preview चल रहा है..."
  );


  try{

    await video.play();


    if(audioLoaded){

      audio.play().catch(
        ()=>{}
      );

    }

  }

  catch(error){

    setStatus(
      "❌ Video play नहीं हुआ"
    );

    return;

  }


  video.ontimeupdate =
    function(){

      const elapsed =
        video.currentTime -
        start;


      const total =
        end - start;


      setProgress(
        (elapsed / total) * 100
      );


      if(
        video.currentTime >= end
      ){

        video.pause();


        if(audioLoaded)
          audio.pause();


        video.ontimeupdate =
          null;


        setProgress(100);


        setStatus(
          "✅ Preview finished"
        );

      }

    };

}


/* =========================
   SMART SETTINGS
========================= */

function smartEdit(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  const duration =
    video.duration;


  /*
    Shorts के लिए
    maximum 20 seconds
  */

  let start = 0;

  let end =
    Math.min(
      duration,
      20
    );


  if(duration > 30){

    start =
      Math.floor(
        duration * .20
      );


    end =
      Math.min(
        duration,
        start + 20
      );

  }


  document.getElementById(
    "start"
  ).value =
    start.toFixed(1);


  document.getElementById(
    "end"
  ).value =
    end.toFixed(1);


  format.value =
    "vertical";


  document.getElementById(
    "videoText"
  ).value =
    "NAVAL GAMING 🔥";


  document.getElementById(
    "filter"
  ).value =
    "contrast(1.35) saturate(1.4)";


  document.getElementById(
    "videoVolume"
  ).value =
    "80";


  document.getElementById(
    "audioVolume"
  ).value =
    audioLoaded ? "25" : "0";


  updateVolumes();

  updateFormatInfo();


  setProgress(100);


  setStatus(
    "🧠 Smart settings apply हो गईं — अब PLAY EDITED PREVIEW दबाओ"
  );

}


/* =========================
   CHECK SETTINGS
========================= */

function showEditInfo(){

  if(!videoLoaded){

    alert(
      "पहले Video select करो"
    );

    return;
  }


  const start =
    document.getElementById(
      "start"
    ).value;


  const end =
    document.getElementById(
      "end"
    ).value;


  const text =
    document.getElementById(
      "videoText"
    ).value ||
    "कोई caption नहीं";


  let formatName;


  if(format.value === "vertical"){

    formatName =
      "9:16 Shorts/Reels";

  }

  else if(format.value === "square"){

    formatName =
      "1:1 Square";

  }

  else{

    formatName =
      "16:9 YouTube";

  }


  alert(
    "✅ EDIT SETTINGS\n\n" +
    "✂️ Start: " + start + " sec\n" +
    "⏱️ End: " + end + " sec\n" +
    "📱 Format: " + formatName + "\n" +
    "📝 Caption: " + text
  );

}


/* =========================
   RESET
========================= */

function resetEditor(){

  location.reload();

}


/* =========================
   INITIAL
========================= */

updateVolumes();

updateFormatInfo();

</script>

</body>
  </html>
