<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NAVAL AI VIDEO EDITOR</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0b0b0d;--panel:#151519;--panel2:#1d1d22;--line:#2b2b31;
  --text:#f5f5f7;--muted:#9a9aa3;--accent:#12d7e9;--accent2:#00bcd4;
}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
button,input{font:inherit}
button{border:0;color:var(--text);cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:var(--bg)}
.topbar{height:64px;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #16161a}
.iconBtn{width:42px;height:42px;border-radius:12px;background:transparent;font-size:27px;display:grid;place-items:center}
.title{font-weight:750;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aiSelect{background:#242428;border-radius:14px;padding:11px 14px;font-weight:700}
.export{background:var(--accent);color:#001114;padding:11px 18px;border-radius:13px;font-weight:800}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column}
.previewWrap{flex:1;min-height:280px;display:flex;align-items:center;justify-content:center;padding:12px 18px 8px;position:relative}
.previewBox{height:100%;max-height:620px;aspect-ratio:9/16;background:#050506;border-radius:3px;overflow:hidden;position:relative;box-shadow:0 10px 40px #000}
#videoPreview{width:100%;height:100%;object-fit:contain;background:#050506;display:none}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;text-align:center;padding:25px}
.empty .big{font-size:42px}
.loadBtn{background:#242429;padding:11px 16px;border-radius:12px;color:white;font-weight:700}
.previewControls{position:absolute;left:0;right:0;bottom:0;padding:35px 10px 10px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.play{width:48px;height:48px;border-radius:50%;background:#fff;color:#111;font-size:20px}
.sideTools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.sideTools button{width:40px;height:40px;border-radius:12px;background:rgba(25,25,29,.9);font-size:18px}
.timeRow{height:32px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.timelineArea{height:210px;border-top:1px solid var(--line);background:#101014;position:relative;overflow:hidden}
.ruler{height:28px;display:flex;align-items:end;gap:35px;padding-left:20px;color:#777;font-size:10px;white-space:nowrap}
.timeline{height:126px;position:relative;margin:0 12px;overflow:hidden}
.track{height:48px;border-radius:8px;margin:5px 0;position:relative;overflow:hidden;background:#202025}
.videoTrack{background:#24242a}
.audioTrack{background:#123d42}
.textTrack{background:#2a1730}
.trackLabel{position:absolute;z-index:2;left:7px;top:5px;font-size:10px;color:#ddd;background:rgba(0,0,0,.45);padding:3px 6px;border-radius:5px}
.thumbs{display:flex;height:100%;opacity:.9}
.thumbs img{height:100%;width:80px;object-fit:cover;flex:none}
.wave{height:100%;display:flex;align-items:center;gap:2px;padding:0 8px}
.wave i{display:block;width:3px;border-radius:3px;background:#28d6e4}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0%;z-index:8;box-shadow:0 0 5px #fff}
.playhead:before{content:"";position:absolute;top:-1px;left:-5px;width:12px;height:12px;border-radius:50%;background:#fff}
.toolPanel{height:78px;border-top:1px solid var(--line);background:#0d0d10;display:flex;align-items:center;overflow-x:auto;padding:7px 8px;gap:8px;scrollbar-width:none}
.toolPanel::-webkit-scrollbar{display:none}
.tool{min-width:70px;height:64px;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#aaa;font-size:11px}
.tool .ico{font-size:23px}.tool.active{background:#202025;color:#fff}.tool.ai{color:#12d7e9}
.bottomSheet{position:absolute;left:0;right:0;bottom:0;background:#17171b;border-top:1px solid var(--line);padding:14px;border-radius:20px 20px 0 0;transform:translateY(110%);transition:.25s;z-index:30;max-height:62%;overflow:auto}
.bottomSheet.open{transform:translateY(0)}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:800}
.closeSheet{background:#29292f;width:34px;height:34px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.option{background:#24242a;padding:13px 7px;border-radius:12px;text-align:center;font-size:12px}
.option b{display:block;font-size:19px;margin-bottom:4px}
.rangeRow{display:flex;gap:10px;align-items:center;margin:12px 0}
.rangeRow input{flex:1}
input[type=range]{accent-color:var(--accent)}
.fileInput{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.modalCard{width:min(420px,100%);background:#18181c;border:1px solid #303037;border-radius:20px;padding:20px}
.modalCard h2{margin:0 0 10px}.progress{height:8px;background:#29292e;border-radius:10px;overflow:hidden;margin:18px 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:.2s}
@media(min-width:700px){
 .timelineArea{height:240px}.toolPanel{height:88px}
 .tool{min-width:85px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="iconBtn" id="backBtn">×</button>
    <div class="title">NAVAL AI VIDEO EDITOR</div>
    <button class="aiSelect" id="aiBtn">AI UHD⌄</button>
    <button class="export" id="exportBtn">Export</button>
  </header>

  <main class="workspace">
    <section class="previewWrap">
      <div class="previewBox">
        <div class="empty" id="emptyState">
          <div class="big">🎬</div>
          <b>Video select karo</b>
          <span>Apna video aur audio add karke editing start karo</span>
          <button class="loadBtn" id="pickVideo">＋ Add Video</button>
        </div>
        <video id="videoPreview" playsinline></video>
        <audio id="bgAudio" style="display:none"></audio>
        <div class="sideTools">
          <button id="fitBtn">⛶</button>
          <button id="muteBtn">🔊</button>
          <button id="aiAuto">🤖</button>
        </div>
        <div class="previewControls">
          <button class="play" id="playBtn">▶</button>
        </div>
      </div>
    </section>

    <div class="timeRow">
      <span id="currentTime">00:00</span><span id="totalTime">00:00</span>
    </div>

    <section class="timelineArea">
      <div class="ruler"><span>00:00</span><span>00:02</span><span>00:04</span><span>00:06</span><span>00:08</span><span>00:10</span></div>
      <div class="timeline" id="timeline">
        <div class="playhead" id="playhead"></div>
        <div class="track videoTrack" id="videoTrack"><span class="trackLabel">🎬 VIDEO</span><div class="thumbs" id="thumbs"></div></div>
        <div class="track audioTrack"><span class="trackLabel">🎵 AUDIO</span><div class="wave" id="wave"></div></div>
        <div class="track textTrack"><span class="trackLabel">T TEXT / CAPTIONS</span></div>
      </div>
    </section>

    <nav class="toolPanel">
      <button class="tool active" data-sheet="edit"><span class="ico">✂️</span>Edit</button>
      <button class="tool" data-sheet="audio"><span class="ico">🎵</span>Audio</button>
      <button class="tool" data-sheet="text"><span class="ico">T</span>Text</button>
      <button class="tool" data-sheet="effects"><span class="ico">✨</span>Effects</button>
      <button class="tool" data-sheet="overlay"><span class="ico">🖼️</span>Overlay</button>
      <button class="tool" data-sheet="captions"><span class="ico">📝</span>Captions</button>
      <button class="tool ai" id="aiTool"><span class="ico">🤖</span>AI Edit</button>
    </nav>
  </main>

  <input class="fileInput" type="file" id="videoInput" accept="video/*">
  <input class="fileInput" type="file" id="audioInput" accept="audio/*">

  <section class="bottomSheet" id="sheet">
    <div class="sheetHead"><span id="sheetTitle">Edit</span><button class="closeSheet" id="closeSheet">×</button></div>
    <div id="sheetContent"></div>
  </section>
</div>

<div class="modal" id="exportModal">
  <div class="modalCard">
    <h2>Exporting Video</h2>
    <div id="exportStatus">Preparing...</div>
    <div class="progress"><i id="exportProgress"></i></div>
    <b id="exportPercent">0%</b>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$("videoPreview"), audio=$("bgAudio"), input=$("videoInput"), audioInput=$("audioInput");
let videoURL=null, audioURL=null, muted=false;

function fmt(sec){
  if(!isFinite(sec)) return "00:00";
  sec=Math.max(0,Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function makeWave(){
  $("wave").innerHTML="";
  for(let i=0;i<95;i++){
    const b=document.createElement("i");
    b.style.height=(10+Math.random()*31)+"px";
    $("wave").appendChild(b);
  }
}
makeWave();

$("pickVideo").onclick=()=>input.click();
input.onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file);
  video.src=videoURL;
  video.style.display="block";
  $("emptyState").style.display="none";
  createThumb(file);
};
function createThumb(file){
  $("thumbs").innerHTML="";
  const c=document.createElement("canvas"),ctx=c.getContext("2d");
  const v=document.createElement("video");
  v.src=URL.createObjectURL(file); v.muted=true;
  v.onloadedmetadata=()=>{
    const duration=v.duration||1;
    const count=8;
    for(let i=0;i<count;i++){
      v.currentTime=Math.min(duration-0.01,duration*i/count);
      v.onseeked=()=>{
        c.width=160;c.height=90;ctx.drawImage(v,0,0,c.width,c.height);
        const img=document.createElement("img");img.src=c.toDataURL("image/jpeg",.65);
        $("thumbs").appendChild(img);
      };
    }
  };
}
video.onloadedmetadata=()=>{
  $("totalTime").textContent=fmt(video.duration);
};
video.ontimeupdate=()=>{
  $("currentTime").textContent=fmt(video.currentTime);
  const p=video.duration?(video.currentTime/video.duration)*100:0;
  $("playhead").style.left=`calc(${p}% + 0px)`;
};

$("playBtn").onclick=async ()=>{
  if(video.paused){
    await video.play();
    if(audioURL) {
      audio.currentTime = video.currentTime;
      audio.play();
    }
    $("playBtn").textContent="❚❚";
  } else {
    video.pause();
    if(audioURL) audio.pause();
    $("playBtn").textContent="▶";
  }
};
video.onended=()=>{
  $("playBtn").textContent="▶";
  if(audioURL) audio.pause();
};

$("muteBtn").onclick=()=>{
  muted=!muted;
  video.muted=muted;
  audio.muted=muted;
  $("muteBtn").textContent=muted?"🔇":"🔊";
};
$("fitBtn").onclick=()=>{
  if(video.requestFullscreen) video.requestFullscreen();
};

$("backBtn").onclick=()=>alert("Back button ready.");

function openSheet(type){
  const data={
    edit:{
      title:"✂️ Edit",
      html:`<div class="grid">
        <button class="option" onclick="alert('Trim mode')"><b>✂️</b>Trim</button>
        <button class="option" onclick="alert('Split mode')"><b>🔪</b>Split</button>
        <button class="option" onclick="setSpeed(.5)"><b>🐢</b>0.5×</button>
        <button class="option" onclick="setSpeed(2)"><b>⚡</b>2×</button>
      </div>`
    },
    audio:{
      title:"🎵 Audio",
      html:`<button class="loadBtn" id="addAudioBtn">＋ Add Audio / Music</button>
      <div class="rangeRow">Volume <input id="audioVolume" type="range" min="0" max="100" value="100" oninput="if(audio)audio.volume=this.value/100"></div>
      <p id="audioStatus" style="color:#999;font-size:12px">Voiceover aur background music track add karo.</p>`
    },
    text:{
      title:"T Text",
      html:`<input id="captionText" placeholder="Type your text..." style="width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#24242a;color:white">`
    },
    effects:{
      title:"✨ Effects",
      html:`<div class="grid">
      <button class="option" onclick="setEffect('contrast(1.25) saturate(1.3)')"><b>🔥</b>Fire Boost</button>
      <button class="option" onclick="setEffect('none')"><b>↩️</b>Reset</button>
      </div>`
    },
    overlay:{
      title:"🖼️ Overlay",
      html:`<div class="grid"><button class="option"><b>🖼️</b>Image</button></div>`
    },
    captions:{
      title:"📝 Captions",
      html:`<div class="grid"><button class="option"><b>🤖</b>Auto Captions</button></div>`
    }
  };
  $("sheetTitle").textContent=data[type].title;
  $("sheetContent").innerHTML=data[type].html;
  $("sheet").classList.add("open");
  if(type==="audio") {
    const add=document.getElementById("addAudioBtn");
    if(add) add.onclick=chooseAudio;
  }
}
document.querySelectorAll(".tool[data-sheet]").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");openSheet(btn.dataset.sheet);
  };
});
$("closeSheet").onclick=()=>$("sheet").classList.remove("open");

function setSpeed(s){video.playbackRate=s; audio.playbackRate=s;}
function setEffect(e){video.style.filter=e}

function chooseAudio(){
  audioInput.value="";
  audioInput.click();
}
audioInput.onchange=e=>{
  const file=e.target.files && e.target.files[0];
  if(!file)return;
  if(audioURL)URL.revokeObjectURL(audioURL);
  audioURL=URL.createObjectURL(file);
  audio.src=audioURL;
  const status=document.getElementById("audioStatus");
  if(status) status.textContent="🎵 Selected: "+file.name;
};

function runAI(){
  if(!videoURL){alert("Pehle video select karo.");return}
  $("sheetTitle").textContent="🤖 AI Auto Edit";
  $("sheetContent").innerHTML=`<div style="text-align:center;padding:15px">
  <div style="font-size:45px">🤖</div><h3>AI editing...</h3>
  <div class="progress"><i id="aiProgress" style="width:0"></i></div></div>`;
  $("sheet").classList.add("open");
  let n=0;const t=setInterval(()=>{n+=5;const p=$("aiProgress");if(p)p.style.width=n+"%";if(n>=100){clearInterval(t);setTimeout(()=>alert("AI Auto Edit complete!"),150)}} ,80);
}
$("aiBtn").onclick=runAI;$("aiAuto").onclick=runAI;$("aiTool").onclick=runAI;

async function exportEditedVideo(){
  if(!videoURL){alert("Pehle video select karo.");return}
  
  const modal=$("exportModal"),bar=$("exportProgress"),pct=$("exportPercent"),status=$("exportStatus");
  modal.classList.add("show"); bar.style.width="0%"; pct.textContent="0%"; status.textContent="Preparing video...";
  
  let audioCtx=null, recorder=null, animationFrame=null;
  try{
    video.pause(); 
    if(audioURL) audio.pause();
    video.currentTime=0;
    
    await new Promise(r=>{if(video.readyState>=2)r();else video.onloadeddata=()=>r();});
    
    const canvas=document.createElement("canvas");
    canvas.width=video.videoWidth || 720;
    canvas.height=video.videoHeight || 1280;
    const ctx=canvas.getContext("2d");
    
    const canvasStream=canvas.captureStream(30);
    
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
    const dest=audioCtx.createMediaStreamDestination();
    
    try {
      const videoSource=audioCtx.createMediaElementSource(video);
      videoSource.connect(dest);
    } catch(e) { console.log("Video audio capture error"); }

    if(audioURL){
      try {
        const audioSource=audioCtx.createMediaElementSource(audio);
        const gain=audioCtx.createGain();
        gain.gain.value=(document.getElementById("audioVolume")?.value||100)/100;
        audioSource.connect(gain);
        gain.connect(dest);
      } catch(e) { console.log("External audio capture error"); }
    }

    dest.stream.getAudioTracks().forEach(track=>canvasStream.addTrack(track));

    const mimeTypes = [
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm",
      "video/mp4"
    ];
    const mime=mimeTypes.find(x=>MediaRecorder.isTypeSupported(x)) || "";
    
    const chunks=[];
    recorder=new MediaRecorder(canvasStream, mime ? {mimeType:mime} : undefined);
    recorder.ondataavailable=e=>{if(e.data && e.data.size > 0) chunks.push(e.data);};
    
    recorder.start(100);
    await video.play();
    if(audioURL) { audio.currentTime=0; await audio.play(); }

    const renderLoop = () => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      if(!video.ended && !video.paused) {
        animationFrame = requestAnimationFrame(renderLoop);
      }
    };
    renderLoop();

    await new Promise(resolve=>{
      const timer=setInterval(()=>{
        const p=video.duration?Math.min(100,(video.currentTime/video.duration)*100):0;
        bar.style.width=p+"%";pct.textContent=Math.round(p)+"%";status.textContent="Exporting video...";
        if(video.ended){
          clearInterval(timer);
          resolve();
        }
      },100);
    });

    if(animationFrame) cancelAnimationFrame(animationFrame);
    video.pause();
    if(audioURL) audio.pause();

    await new Promise(resolve=>{
      recorder.onstop = resolve;
      recorder.stop();
    });

    const blob=new Blob(chunks,{type: mime || "video/webm"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`EDITED_VIDEO_${Date.now()}.${mime.includes("mp4") ? "mp4" : "webm"}`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    bar.style.width="100%";pct.textContent="100%";status.textContent="Export complete!";
    setTimeout(()=>{modal.classList.remove("show"); URL.revokeObjectURL(url);}, 1000);

  }catch(err){
    console.error(err);
    modal.classList.remove("show");
    alert("Export me issue aaya: "+(err.message||"Unknown error"));
  }finally{
    if(audioCtx) try{await audioCtx.close();}catch(e){}
  }
}

$("exportBtn").onclick=exportEditedVideo;
</script>
</body>
  </html>
