<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAVAL AI VIDEO EDITOR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:18px;
  text-align:center;
  background:#181818;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#aaa;
}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1b1b1b;
  padding:15px;
  margin-bottom:15px;
  border-radius:15px;
}

video{
  width:100%;
  max-height:400px;
  background:#000;
  border-radius:12px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#bbb;
}

input[type="file"],
input[type="text"],
input[type="number"]{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#292929;
  color:white;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#00d9ff;
  color:#000;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

#status{
  color:#00d9ff;
  text-align:center;
}

#download{
  display:none;
  background:#20d46b;
  text-decoration:none;
  color:#000;
  padding:13px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ NAVAL AI VIDEO EDITOR</h1>
  <p>Mobile Video Editing Studio</p>
</header>

<div class="container">

  <div class="card">
    <label>🎬 Video Select करो</label>
    <input id="videoFile" type="file" accept="video/*">

    <video id="video" controls></video>

    <p id="status">Video select करने के लिए ऊपर दबाओ</p>
  </div>

  <div class="card">
    <label>✍️ Video Text</label>
    <input id="textInput" type="text"
           placeholder="अपना text लिखो">

    <button onclick="showText()">TEXT PREVIEW</button>

    <p id="textPreview"
       style="font-size:24px;font-weight:bold;">
    </p>
  </div>

  <div class="card">
    <label>🎵 Background Music</label>
    <input id="musicFile" type="file" accept="audio/*">

    <audio id="music" controls style="width:100%;"></audio>
  </div>

  <div class="card">

    <label>✂️ Start Time (seconds)</label>
    <input id="start" type="number" value="0" min="0">

    <label>⏱️ End Time (seconds)</label>
    <input id="end" type="number" value="10" min="0">

    <div class="row">
      <button onclick="setStart()">START</button>
      <button onclick="setEnd()">END</button>
    </div>

  </div>

  <div class="card">

    <button onclick="playEdit()">▶️ PLAY EDIT</button>

    <button onclick="resetVideo()">
      🔄 RESET
    </button>

    <a id="download">
      ⬇️ DOWNLOAD VIDEO
    </a>

  </div>

</div>

<script>

const video = document.getElementById("video");
const music = document.getElementById("music");
const statusText = document.getElementById("status");

document.getElementById("videoFile").addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  video.src = URL.createObjectURL(file);

  video.onloadedmetadata = function(){

    document.getElementById("end").value =
      Math.floor(video.duration);

    statusText.innerText =
      "✅ Video loaded successfully";
  };

});

document.getElementById("musicFile").addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  music.src = URL.createObjectURL(file);

});

function showText(){

  const text =
    document.getElementById("textInput").value;

  document.getElementById("textPreview").innerText =
    text || "कोई text नहीं लिखा";

}

function setStart(){

  document.getElementById("start").value =
    Math.floor(video.currentTime);

}

function setEnd(){

  document.getElementById("end").value =
    Math.floor(video.currentTime);

}

function playEdit(){

  const start =
    Number(document.getElementById("start").value);

  const end =
    Number(document.getElementById("end").value);

  if(!video.src){

    alert("पहले video select करो");
    return;

  }

  video.currentTime = start;
  video.play();

  statusText.innerText =
    "▶️ Edited section playing...";

  const check = setInterval(function(){

    if(video.currentTime >= end){

      video.pause();
      clearInterval(check);

      statusText.innerText =
        "✅ Preview complete";

    }

  },100);

}

function resetVideo(){

  video.pause();
  video.currentTime = 0;

  document.getElementById("start").value = 0;

  if(video.duration){

    document.getElementById("end").value =
      Math.floor(video.duration);

  }

  statusText.innerText =
    "🔄 Video reset";

}

</script>

</body>
</html>
