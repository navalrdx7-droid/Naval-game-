<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAVAL AI VIDEO EDITOR</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
  background:#111;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  color:#999;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#171717;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

label{
  display:block;
  color:#bbb;
  font-size:16px;
  margin:12px 0 7px;
}

input[type="file"],
input[type="text"],
input[type="number"],
select{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:white;
  font-size:16px;
  outline:none;
}

input[type="range"]{
  width:100%;
  accent-color:#00d9ff;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.auto{
  background:#8b4dff;
  color:#fff;
  font-size:19px;
}

.green{
  background:#20d66b;
}

.red{
  background:#e53935;
  color:#fff;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

video{
  width:100%;
  max-height:420px;
  background:#000;
  border-radius:12px;
  margin-top:10px;
}

audio{
  width:100%;
  margin-top:10px;
}

canvas{
  display:none;
}

.value{
  float:right;
  color:#00d9ff;
  font-weight:bold;
}

.status{
  text-align:center;
  padding:10px;
  color:#00d9ff;
  min-height:25px;
}

.small{
  color:#888;
  font-size:13px;
  margin-top:7px;
}

.progressBox{
  width:100%;
  height:12px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progressBar{
  width:0%;
  height:100%;
  background:#08cbea;
  transition:.2s;
}

.badge{
  display:inline-block;
  background:#222;
  padding:7px 10px;
  border-radius:20px;
  color:#aaa;
  font-size:13px;
  margin-top:8px;
}

</style>
</head>

<body>

<header>

<h1>🎬 NAVAL AI VIDEO EDITOR</h1>

<p>🤖 Smart Automatic Video Editing Studio</p>

</header>


<div class="container">


<!-- VIDEO -->

<div class="card">

<label>🎥 Select Video</label>

<input
type="file"
id="videoFile"
accept="video/*"
>

<video
id="video"
controls
playsinline
preload="metadata">
</video>

<div class="badge" id="videoInfo">
No video selected
</div>

</div>


<!-- MUSIC -->

<div class="card">

<label>🎵 Background Music</label>

<input
type="file"
id="musicFile"
accept="audio/*"
>

<audio
id="music"
controls>
</audio>

</div>


<!-- VOLUME -->

<div class="card">

<label>

🔊 Original Video Sound

<span
class="value"
id="videoVolumeValue">
100%
</span>

</label>

<input
type="range"
id="videoVolume"
min="0"
max="100"
value="100"
>

<label>

🎵 Music Volume

<span
class="value"
id="musicVolumeValue">
30%
</span>

</label>

<input
type="range"
id="musicVolume"
min="0"
max="100"
value="30"
>

</div>


<!-- TRIM -->

<div class="card">

<label>✂️ Start Time</label>

<input
type="number"
id="start"
value="0"
min="0"
step="0.1"
>

<label>⏱️ End Time</label>

<input
type="number"
id="end"
value="0"
min="0"
step="0.1"
>

<div class="row">

<button onclick="setStart()">
✂️ SET START
</button>

<button onclick="setEnd()">
✂️ SET END
</button>

</div>

</div>


<!-- TEXT -->

<div class="card">

<label>📝 Video Text</label>

<input
type="text"
id="videoText"
placeholder="NAVAL GAMING 🔥"
>

</div>


<!-- FILTER -->

<div class="card">

<label>🎨 Video Style</label>

<select id="filter">

<option value="none">
Normal
</option>

<option value="contrast(1.35) saturate(1.4)">
🔥 Gaming Cinematic
</option>

<option value="contrast(1.5) saturate(1.7)">
⚡ Vivid
</option>

<option value="brightness(1.2) saturate(1.5)">
☀️ Bright
</option>

<option value="grayscale(1)">
⚫ Black & White
</option>

<option value="sepia(.7)">
🎞️ Vintage
</option>

<option value="contrast(1.5)">
💥 High Contrast
</option>

</select>

</div>


<!-- AUTO EDIT -->

<div class="card">

<button
class="auto"
id="autoButton"
onclick="autoEdit()">

🤖 AUTO EDIT

</button>

<div class="small">

One-click automatic editing

</div>

</div>


<!-- ACTIONS -->

<div class="card">

<button onclick="previewEdit()">

▶️ PLAY PREVIEW

</button>


<button onclick="createEditedVideo()">

🎬 CREATE EDITED VIDEO

</button>


<button
class="green"
id="downloadButton"
onclick="downloadEditedVideo()">

⬇️ DOWNLOAD VIDEO

</button>


<button
class="red"
onclick="resetEditor()">

🔄 RESET

</button>

</div>


<!-- STATUS -->

<div class="card">

<div
class="status"
id="status">

Video select करो

</div>

<div class="progressBox">

<div
class="progressBar"
id="progressBar">
</div>

</div>

</div>


</div>


<canvas id="canvas"></canvas>


<script>


const video =
document.getElementById("video");

const music =
document.getElementById("music");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const downloadButton =
document.getElementById("downloadButton");

const autoButton =
document.getElementById("autoButton");


let videoURL = "";
let musicURL = "";

let videoFileSelected = false;
let musicFileSelected = false;

let editedBlob = null;
let editedURL = "";

let audioContext = null;

let videoSource = null;
let musicSource = null;

let animationID = null;

let exporting = false;


/* =========================
   STATUS
========================= */

function setStatus(text){

  statusText.innerText = text;

}


/* =========================
   PROGRESS
========================= */

function setProgress(value){

  value =
    Math.max(
      0,
      Math.min(100,value)
    );

  progressBar.style.width =
    value + "%";

}


/* =========================
   AUDIO
========================= */

function setupAudio(){

  if(audioContext)
    return;

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  videoSource =
    audioContext.createMediaElementSource(video);

  musicSource =
    audioContext.createMediaElementSource(music);

  videoSource.connect(
    audioContext.destination
  );

  musicSource.connect(
    audioContext.destination
  );

}


/* =========================
   VOLUME
========================= */

function updateVolumes(){

  const videoVolume =
    Number(
      document.getElementById(
        "videoVolume"
      ).value
    ) / 100;

  const musicVolume =
    Number(
      document.getElementById(
        "musicVolume"
      ).value
    ) / 100;

  document.getElementById(
    "videoVolumeValue"
  ).innerText =
    Math.round(
      videoVolume * 100
    ) + "%";

  document.getElementById(
    "musicVolumeValue"
  ).innerText =
    Math.round(
      musicVolume * 100
    ) + "%";

  video.volume =
    videoVolume;

  music.volume =
    musicVolume;

}


document
.getElementById("videoVolume")
.addEventListener(
  "input",
  updateVolumes
);


document
.getElementById("musicVolume")
.addEventListener(
  "input",
  updateVolumes
);


/* =========================
   VIDEO
========================= */

document
.getElementById("videoFile")
.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file)
      return;

    videoFileSelected = true;

    if(videoURL)
      URL.revokeObjectURL(videoURL);

    videoURL =
      URL.createObjectURL(file);

    video.src =
      videoURL;

    video.onloadedmetadata =
      function(){

        document.getElementById(
          "start"
        ).value = 0;

        document.getElementById(
          "end"
        ).value =
          video.duration.toFixed(1);

        document.getElementById(
          "videoInfo"
        ).innerText =
          "🎥 " +
          Math.round(video.duration) +
          " sec video";

        setStatus(
          "✅ Video loaded successfully"
        );

        setProgress(0);

        updateVolumes();

      };

  }
);


/* =========================
   MUSIC
========================= */

document
.getElementById("musicFile")
.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file)
      return;

    musicFileSelected = true;

    if(musicURL)
      URL.revokeObjectURL(musicURL);

    musicURL =
      URL.createObjectURL(file);

    music.src =
      musicURL;

    music.loop = true;

    setStatus(
      "🎵 Background music loaded"
    );

  }
);


/* =========================
   START
========================= */

function setStart(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }

  document.getElementById(
    "start"
  ).value =
    video.currentTime.toFixed(1);

  setStatus(
    "✂️ Start time set"
  );

}


/* =========================
   END
========================= */

function setEnd(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }

  document.getElementById(
    "end"
  ).value =
    video.currentTime.toFixed(1);

  setStatus(
    "✂️ End time set"
  );

}


/* =========================
   FILTER
========================= */

function getFilter(){

  return document.getElementById(
    "filter"
  ).value;

}


/* =========================
   DRAW FRAME
========================= */

function drawFrame(){

  if(!video.videoWidth)
    return;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  ctx.filter =
    getFilter();

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.filter =
    "none";


  /* TEXT */

  const text =
    document.getElementById(
      "videoText"
    ).value.trim();

  if(text){

    ctx.font =
      "bold " +
      Math.max(
        30,
        canvas.width * .055
      ) +
      "px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "bottom";

    ctx.fillStyle =
      "white";

    ctx.strokeStyle =
      "black";

    ctx.lineWidth = 5;

    ctx.strokeText(
      text,
      canvas.width / 2,
      canvas.height - 35
    );

    ctx.fillText(
      text,
      canvas.width / 2,
      canvas.height - 35
    );

  }

}


/* =========================
   PREVIEW
========================= */

async function previewEdit(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }

  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );

  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );

  if(end <= start){

    alert(
      "End time सही करो"
    );

    return;
  }

  try{

    video.currentTime =
      start;

    if(musicFileSelected){

      music.currentTime = 0;

      music.play().catch(
        ()=>{}
      );

    }

    await video.play();

    setStatus(
      "▶️ Preview चल रहा है..."
    );

    video.ontimeupdate =
      function(){

        if(
          video.currentTime >= end
        ){

          video.pause();

          if(musicFileSelected)
            music.pause();

          video.ontimeupdate =
            null;

          setStatus(
            "✅ Preview finished"
          );

        }

      };

  }catch(error){

    setStatus(
      "⚠️ Preview शुरू नहीं हुआ"
    );

  }

}


/* =========================
   AUTO EDIT
========================= */

async function autoEdit(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }

  if(exporting)
    return;


  const duration =
    video.duration;


  if(
    !duration ||
    duration <= 0
  ){

    alert(
      "Video अभी load हो रही है"
    );

    return;
  }


  /*
    SMART AUTO SETTINGS
  */

  let editLength;


  if(duration <= 15){

    editLength =
      duration;

  }else{

    editLength =
      Math.min(
        duration,
        20
      );

  }


  document.getElementById(
    "start"
  ).value = 0;


  document.getElementById(
    "end"
  ).value =
    editLength.toFixed(1);


  document.getElementById(
    "videoText"
  ).value =
    "NAVAL GAMING 🔥";


  document.getElementById(
    "filter"
  ).value =
    "contrast(1.35) saturate(1.4)";


  document.getElementById(
    "videoVolume"
  ).value = 80;


  document.getElementById(
    "musicVolume"
  ).value = 30;


  updateVolumes();


  setStatus(
    "🤖 AI Auto Edit settings तैयार..."
  );


  setProgress(10);


  /*
    AUTO EXPORT
  */

  setTimeout(
    async function(){

      await createEditedVideo(true);

    },
    500
  );

}


/* =========================
   CREATE EDITED VIDEO
========================= */

async function createEditedVideo(
  automatic = false
){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  if(exporting)
    return;


  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(end <= start){

    alert(
      "End time सही करो"
    );

    return;
  }


  exporting = true;

  autoButton.disabled = true;

  downloadButton.disabled = true;


  try{


    /*
      AUDIO CONTEXT
    */

    setupAudio();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


    setStatus(
      automatic
      ? "🤖 Auto editing शुरू..."
      : "⏳ Video editing शुरू..."
    );


    setProgress(15);


    /*
      CANVAS
    */

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const canvasStream =
      canvas.captureStream(30);


    /*
      AUDIO MIX
    */

    const destination =
      audioContext.createMediaStreamDestination();


    const videoGain =
      audioContext.createGain();

    const musicGain =
      audioContext.createGain();


    videoGain.gain.value =
      Number(
        document.getElementById(
          "videoVolume"
        ).value
      ) / 100;


    musicGain.gain.value =
      Number(
        document.getElementById(
          "musicVolume"
        ).value
      ) / 100;


    videoSource.connect(
      videoGain
    );

    musicSource.connect(
      musicGain
    );


    videoGain.connect(
      destination
    );

    musicGain.connect(
      destination
    );


    const combinedStream =
      new MediaStream();


    canvasStream
    .getVideoTracks()
    .forEach(
      track =>
        combinedStream.addTrack(track)
    );


    destination
    .stream
    .getAudioTracks()
    .forEach(
      track =>
        combinedStream.addTrack(track)
    );


    /*
      RECORDER
    */

    let mimeType =
      "video/webm;codecs=vp9,opus";


    if(
      !MediaRecorder.isTypeSupported(
        mimeType
      )
    ){

      mimeType =
        "video/webm;codecs=vp8,opus";

    }


    if(
      !MediaRecorder.isTypeSupported(
        mimeType
      )
    ){

      mimeType =
        "video/webm";

    }


    const recorder =
      new MediaRecorder(
        combinedStream,
        {
          mimeType:mimeType
        }
      );


    const chunks = [];


    recorder.ondataavailable =
      function(event){

        if(
          event.data.size > 0
        ){

          chunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      function(){

        editedBlob =
          new Blob(
            chunks,
            {
              type:
                recorder.mimeType
            }
          );


        if(editedURL){

          URL.revokeObjectURL(
            editedURL
          );

        }


        editedURL =
          URL.createObjectURL(
            editedBlob
          );


        try{

          videoSource.disconnect(
            videoGain
          );

          musicSource.disconnect(
            musicGain
          );

        }catch(e){}


        exporting = false;

        autoButton.disabled =
          false;

        downloadButton.disabled =
          false;


        setProgress(100);


        setStatus(
          "✅ Video तैयार है! DOWNLOAD दबाओ."
        );

      };


    /*
      SEEK
    */

    video.pause();


    if(musicFileSelected)
      music.pause();


    video.currentTime =
      start;


    await new Promise(
      resolve => {

        const seekHandler =
          function(){

            video.removeEventListener(
              "seeked",
              seekHandler
            );

            resolve();

          };


        video.addEventListener(
          "seeked",
          seekHandler
        );

      }
    );


    /*
      START RECORDING
    */

    recorder.start(200);


    setProgress(20);


    /*
      MUSIC
    */

    if(musicFileSelected){

      music.currentTime = 0;

      music.loop = true;

      music.play().catch(
        ()=>{}
      );

    }


    /*
      VIDEO
    */

    await video.play();


    /*
      RENDER LOOP
    */

    function render(){

      if(
        video.paused ||
        video.ended
      ){

        return;

      }


      drawFrame();


      const elapsed =
        video.currentTime - start;

      const total =
        end - start;


      const percent =
        20 +
        (
          elapsed /
          total
        ) * 75;


      setProgress(
        Math.min(
          95,
          percent
        )
      );


      animationID =
        requestAnimationFrame(
          render
        );

    }


    render();


    /*
      STOP
    */

    video.ontimeupdate =
      function(){

        if(
          video.currentTime >= end
        ){

          video.pause();


          if(musicFileSelected)
            music.pause();


          cancelAnimationFrame(
            animationID
          );


          video.ontimeupdate =
            null;


          drawFrame();


          recorder.stop();

        }

      };


  }catch(error){

    console.error(error);


    exporting = false;

    autoButton.disabled =
      false;

    downloadButton.disabled =
      false;


    setProgress(0);


    setStatus(
      "❌ Export में समस्या आई"
    );


    alert(
      "Browser इस video/audio format को export नहीं कर पा रहा है."
    );

  }

}


/* =========================
   DOWNLOAD
========================= */

function downloadEditedVideo(){

  if(!editedBlob){

    alert(
      "पहले video create करो"
    );

    return;
  }


  const link =
    document.createElement(
      "a"
    );


  link.href =
    editedURL;


  link.download =
    "NAVAL_AI_EDITED_VIDEO.webm";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setStatus(
    "⬇️ Download started"
  );

}


/* =========================
   RESET
========================= */

function resetEditor(){

  location.reload();

}


/* =========================
   INITIAL
========================= */

downloadButton.disabled =
  true;

updateVolumes();

</script>

</body>
  </html>
