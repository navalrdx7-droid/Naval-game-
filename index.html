<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAVAL AI VIDEO EDITOR</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0d0d0d;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:18px 10px;
  background:#151515;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  color:#999;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#181818;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

label{
  display:block;
  color:#bbb;
  font-size:17px;
  margin:12px 0 7px;
}

input[type="file"],
input[type="text"],
input[type="number"],
select{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:white;
  font-size:16px;
}

input[type="range"]{
  width:100%;
  accent-color:#00d9ff;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.auto{
  background:#8b4dff;
  color:white;
}

.green{
  background:#20d66b;
}

.red{
  background:#e53935;
  color:white;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

video{
  width:100%;
  max-height:420px;
  background:#000;
  border-radius:12px;
  margin-top:10px;
}

canvas{
  display:none;
}

.value{
  float:right;
  color:#00d9ff;
  font-weight:bold;
}

.status{
  text-align:center;
  padding:10px;
  color:#00d9ff;
  min-height:25px;
}

.small{
  color:#888;
  font-size:13px;
  margin-top:5px;
}
</style>
</head>

<body>

<header>
  <h1>🎬 NAVAL AI VIDEO EDITOR</h1>
  <p>Manual + Automatic Editing Studio</p>
</header>

<div class="container">

  <!-- VIDEO -->
  <div class="card">

    <label>🎥 Select Video</label>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <video
      id="video"
      controls
      playsinline
      preload="metadata">
    </video>

  </div>


  <!-- MUSIC -->
  <div class="card">

    <label>🎵 Background Music</label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*">

    <audio
      id="music"
      controls
      style="width:100%;margin-top:10px;">
    </audio>

  </div>


  <!-- VOLUME -->
  <div class="card">

    <label>
      🔊 Original Video Sound
      <span class="value" id="videoVolumeValue">100%</span>
    </label>

    <input
      type="range"
      id="videoVolume"
      min="0"
      max="100"
      value="100">

    <label>
      🎵 Background Music Volume
      <span class="value" id="musicVolumeValue">30%</span>
    </label>

    <input
      type="range"
      id="musicVolume"
      min="0"
      max="100"
      value="30">

    <div class="small">
      Exported video में दोनों sounds का volume इसी setting के अनुसार रहेगा।
    </div>

  </div>


  <!-- TRIM -->
  <div class="card">

    <label>✂️ Start Time (seconds)</label>

    <input
      type="number"
      id="start"
      value="0"
      min="0"
      step="0.1">

    <label>⏱️ End Time (seconds)</label>

    <input
      type="number"
      id="end"
      value="0"
      min="0"
      step="0.1">

    <div class="row">

      <button onclick="setStart()">
        ✂️ SET START
      </button>

      <button onclick="setEnd()">
        ✂️ SET END
      </button>

    </div>

  </div>


  <!-- TEXT -->
  <div class="card">

    <label>📝 Video Text</label>

    <input
      type="text"
      id="videoText"
      placeholder="NAVAL GAMING">

  </div>


  <!-- FILTER -->
  <div class="card">

    <label>🎨 Filter</label>

    <select id="filter">

      <option value="none">Normal</option>
      <option value="grayscale(1)">Black & White</option>
      <option value="sepia(0.7)">Vintage</option>
      <option value="contrast(1.35) saturate(1.3)">Cinematic</option>
      <option value="brightness(1.2) saturate(1.5)">Bright</option>
      <option value="contrast(1.5)">High Contrast</option>
      <option value="saturate(2)">Vivid</option>

    </select>

  </div>


  <!-- AUTO EDIT -->
  <div class="card">

    <button
      class="auto"
      onclick="autoEdit()">
      🤖 AUTO EDIT
    </button>

    <div class="small">
      Auto Edit basic trim, cinematic filter और text setting automatically लगाएगा।
    </div>

  </div>


  <!-- ACTIONS -->
  <div class="card">

    <button onclick="previewEdit()">
      ▶️ PLAY EDIT
    </button>

    <button onclick="createEditedVideo()">
      🎬 CREATE EDITED VIDEO
    </button>

    <button
      class="green"
      onclick="downloadEditedVideo()">
      ⬇️ DOWNLOAD EDITED VIDEO
    </button>

    <button
      class="red"
      onclick="resetEditor()">
      🔄 RESET
    </button>

  </div>


  <div class="card">
    <div
      class="status"
      id="status">
      Video select करो
    </div>
  </div>

</div>


<canvas id="canvas"></canvas>


<script>

const video = document.getElementById("video");
const music = document.getElementById("music");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");

let videoURL = "";
let musicURL = "";

let videoFileSelected = false;
let musicFileSelected = false;

let videoSource = null;
let musicSource = null;
let audioContext = null;

let editedBlob = null;
let editedURL = "";

let animationID = null;


/* =========================
   AUDIO SYSTEM
========================= */

function setupAudio(){

  if(audioContext) return;

  audioContext =
    new (window.AudioContext ||
         window.webkitAudioContext)();

  videoSource =
    audioContext.createMediaElementSource(video);

  musicSource =
    audioContext.createMediaElementSource(music);

  videoSource.connect(audioContext.destination);
  musicSource.connect(audioContext.destination);
}


function updateVolumes(){

  const videoVolume =
    Number(
      document.getElementById("videoVolume").value
    ) / 100;

  const musicVolume =
    Number(
      document.getElementById("musicVolume").value
    ) / 100;

  document.getElementById(
    "videoVolumeValue"
  ).innerText =
    Math.round(videoVolume * 100) + "%";

  document.getElementById(
    "musicVolumeValue"
  ).innerText =
    Math.round(musicVolume * 100) + "%";

  video.volume = videoVolume;
  music.volume = musicVolume;
}


document
.getElementById("videoVolume")
.addEventListener(
  "input",
  updateVolumes
);


document
.getElementById("musicVolume")
.addEventListener(
  "input",
  updateVolumes
);


/* =========================
   VIDEO SELECT
========================= */

document
.getElementById("videoFile")
.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file) return;

    videoFileSelected = true;

    videoURL =
      URL.createObjectURL(file);

    video.src = videoURL;

    video.onloadedmetadata =
      function(){

        document.getElementById("start").value = 0;

        document.getElementById("end").value =
          video.duration.toFixed(1);

        statusText.innerText =
          "✅ Video loaded";

        setupAudio();
        updateVolumes();
      };

  }
);


/* =========================
   MUSIC SELECT
========================= */

document
.getElementById("musicFile")
.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file) return;

    musicFileSelected = true;

    musicURL =
      URL.createObjectURL(file);

    music.src = musicURL;

    music.loop = true;

    statusText.innerText =
      "🎵 Background music loaded";

    setupAudio();
    updateVolumes();
  }
);


/* =========================
   START / END
========================= */

function setStart(){

  if(!videoFileSelected){
    alert("पहले video select करो");
    return;
  }

  document.getElementById("start").value =
    video.currentTime.toFixed(1);

  statusText.innerText =
    "✂️ Start time set";
}


function setEnd(){

  if(!videoFileSelected){
    alert("पहले video select करो");
    return;
  }

  document.getElementById("end").value =
    video.currentTime.toFixed(1);

  statusText.innerText =
    "✂️ End time set";
}


/* =========================
   FILTER
========================= */

function getFilter(){

  return document.getElementById(
    "filter"
  ).value;
}


/* =========================
   DRAW VIDEO
========================= */

function drawFrame(){

  if(!video.videoWidth){
    return;
  }

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  ctx.filter =
    getFilter();

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.filter = "none";


  /* TEXT */

  const text =
    document.getElementById(
      "videoText"
    ).value.trim();

  if(text){

    ctx.font =
      "bold " +
      Math.max(
        30,
        canvas.width * 0.055
      ) +
      "px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "bottom";

    ctx.fillStyle =
      "white";

    ctx.strokeStyle =
      "black";

    ctx.lineWidth = 5;

    ctx.strokeText(
      text,
      canvas.width / 2,
      canvas.height - 35
    );

    ctx.fillText(
      text,
      canvas.width / 2,
      canvas.height - 35
    );
  }

}


/* =========================
   PREVIEW
========================= */

async function previewEdit(){

  if(!videoFileSelected){

    alert("पहले video select करो");
    return;
  }

  setupAudio();

  if(
    audioContext &&
    audioContext.state === "suspended"
  ){
    await audioContext.resume();
  }

  updateVolumes();

  const start =
    Number(
      document.getElementById("start").value
    );

  const end =
    Number(
      document.getElementById("end").value
    );

  if(end <= start){

    alert("End time Start time से बड़ा होना चाहिए");
    return;
  }

  video.currentTime = start;

  if(musicFileSelected){
    music.currentTime = 0;
    music.play().catch(()=>{});
  }

  video.play().catch(()=>{});

  statusText.innerText =
    "▶️ Playing edit...";

  video.ontimeupdate =
    function(){

      if(video.currentTime >= end){

        video.pause();

        if(musicFileSelected){
          music.pause();
        }

        video.ontimeupdate = null;

        statusText.innerText =
          "✅ Preview finished";
      }
    };
}


/* =========================
   AUTO EDIT
========================= */

function autoEdit(){

  if(!videoFileSelected){

    alert("पहले video select करो");
    return;
  }

  const duration =
    video.duration;

  const end =
    Math.min(
      duration,
      15
    );

  document.getElementById(
    "start"
  ).value = "0";

  document.getElementById(
    "end"
  ).value =
    end.toFixed(1);

  document.getElementById(
    "videoText"
  ).value =
    "NAVAL GAMING 🔥";

  document.getElementById(
    "filter"
  ).value =
    "contrast(1.35) saturate(1.3)";

  document.getElementById(
    "videoVolume"
  ).value = 80;

  document.getElementById(
    "musicVolume"
  ).value = 30;

  updateVolumes();

  statusText.innerText =
    "🤖 AUTO EDIT applied successfully";
}


/* =========================
   CREATE EDITED VIDEO
========================= */

async function createEditedVideo(){

  if(!videoFileSelected){

    alert("पहले video select करो");
    return;
  }

  const start =
    Number(
      document.getElementById("start").value
    );

  const end =
    Number(
      document.getElementById("end").value
    );

  if(end <= start){

    alert(
      "End time Start time से बड़ा होना चाहिए"
    );

    return;
  }


  setupAudio();

  if(
    audioContext &&
    audioContext.state === "suspended"
  ){
    await audioContext.resume();
  }


  statusText.innerText =
    "⏳ Edited video बन रहा है...";


  /* Canvas size */

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  /* Canvas stream */

  const canvasStream =
    canvas.captureStream(30);


  /* Audio mixing */

  const destination =
    audioContext.createMediaStreamDestination();


  const videoGain =
    audioContext.createGain();

  const musicGain =
    audioContext.createGain();


  videoGain.gain.value =
    Number(
      document.getElementById(
        "videoVolume"
      ).value
    ) / 100;


  musicGain.gain.value =
    Number(
      document.getElementById(
        "musicVolume"
      ).value
    ) / 100;


  videoSource.connect(
    videoGain
  );

  musicSource.connect(
    musicGain
  );


  videoGain.connect(
    destination
  );

  musicGain.connect(
    destination
  );


  /* Combine video + audio */

  const combinedStream =
    new MediaStream();

  canvasStream
    .getVideoTracks()
    .forEach(
      track =>
        combinedStream.addTrack(track)
    );

  destination
    .stream
    .getAudioTracks()
    .forEach(
      track =>
        combinedStream.addTrack(track)
    );


  /* Recorder */

  let mimeType =
    "video/webm;codecs=vp9,opus";

  if(
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ){
    mimeType =
      "video/webm;codecs=vp8,opus";
  }

  if(
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ){
    mimeType =
      "video/webm";
  }


  const recorder =
    new MediaRecorder(
      combinedStream,
      {
        mimeType:mimeType
      }
    );


  const chunks = [];


  recorder.ondataavailable =
    function(e){

      if(e.data.size > 0){
        chunks.push(e.data);
      }

    };


  recorder.onstop =
    function(){

      editedBlob =
        new Blob(
          chunks,
          {
            type:
              recorder.mimeType
          }
        );

      editedURL =
        URL.createObjectURL(
          editedBlob
        );


      /* disconnect export gains */

      try{
        videoSource.disconnect(
          videoGain
        );

        musicSource.disconnect(
          musicGain
        );
      }catch(e){}


      statusText.innerText =
        "✅ Edited video तैयार है! अब Download दबाओ।";

    };


  /* Start */

  video.pause();

  if(musicFileSelected){
    music.pause();
  }


  video.currentTime =
    start;


  await new Promise(
    resolve => {

      video.onseeked =
        function(){

          video.onseeked = null;

          resolve();

        };

    }
  );


  recorder.start(200);


  /* Music */

  if(musicFileSelected){

    music.currentTime = 0;

    music.loop = true;

    music.play().catch(()=>{});
  }


  /* Video */

  video.play().catch(()=>{});


  /* Draw loop */

  function render(){

    if(
      video.paused ||
      video.ended
    ){
      return;
    }

    drawFrame();

    animationID =
      requestAnimationFrame(
        render
      );
  }


  render();


  /* Stop at end */

  video.ontimeupdate =
    function(){

      if(
        video.currentTime >= end
      ){

        video.pause();

        if(musicFileSelected){
          music.pause();
        }

        cancelAnimationFrame(
          animationID
        );

        video.ontimeupdate = null;

        recorder.stop();

      }

    };

}


/* =========================
   DOWNLOAD
========================= */

function downloadEditedVideo(){

  if(!editedBlob){

    alert(
      "पहले CREATE EDITED VIDEO दबाओ"
    );

    return;
  }

  const link =
    document.createElement("a");

  link.href =
    editedURL;

  link.download =
    "NAVAL_EDITED_VIDEO.webm";

  document.body.appendChild(link);

  link.click();

  link.remove();

  statusText.innerText =
    "⬇️ Download started";
}


/* =========================
   RESET
========================= */

function resetEditor(){

  location.reload();

}


/* =========================
   INITIAL VOLUME
========================= */

updateVolumes();

</script>

</body>
      </html>
