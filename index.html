<script>

/* INTRO */

function hideIntro(){

  const intro =
    document.getElementById("intro");

  if(!intro){
    return;
  }

  intro.style.opacity = "0";
  intro.style.pointerEvents = "none";

  setTimeout(function(){

    intro.style.display = "none";

  },700);

}

if(document.readyState === "loading"){

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      setTimeout(
        hideIntro,
        1900
      );

    }
  );

}else{

  setTimeout(
    hideIntro,
    1900
  );

}

window.addEventListener(
  "load",
  function(){

    setTimeout(
      hideIntro,
      1900
    );

  }
);
/* ELEMENTS */

const video =
document.getElementById("video");

const music =
document.getElementById("music");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");
/* VARIABLES */

let videoURL="";

let musicURL="";

let videoReady=false;

let musicReady=false;

let editedBlob=null;

let editedURL="";

let exporting=false;


/* STATUS */

function status(text){

statusText.innerText=text;

}

function progress(value){

progressBar.style.width=
Math.max(0,Math.min(100,value))+"%";

}


/* VIDEO SELECT */

document
.getElementById("videoFile")
.addEventListener("change",function(){

const file=this.files &&
this.files[0];

if(!file){

return;

}

if(videoURL){

URL.revokeObjectURL(videoURL);

}

videoURL=
URL.createObjectURL(file);

videoReady=false;

video.pause();

video.removeAttribute("src");

video.load();

video.src=videoURL;

video.controls=true;

video.muted=false;

video.volume=
Number(
document.getElementById("videoVolume").value
)/100;

video.playbackRate=
Number(
document.getElementById("speed").value
);

video.onloadedmetadata=function(){

videoReady=true;

document
.getElementById("start")
.value=0;

document
.getElementById("end")
.value=
video.duration.toFixed(1);

document
.getElementById("videoInfo")
.innerText=
"🎥 "+
Math.round(video.duration)+
" sec • "+
video.videoWidth+
"x"+
video.videoHeight;

status(
"✅ Video ready — ▶️ Play दबाओ"
);

progress(0);

};

video.oncanplay=function(){

if(videoReady){

status(
"▶️ Video play करने के लिए तैयार है"
);

}

};

video.onerror=function(){

console.error(
"Video error:",
video.error
);

status(
"❌ Video load नहीं हो पाया"
);

};

video.load();

});


/* MUSIC */

document
.getElementById("musicFile")
.addEventListener("change",function(){

const file=
this.files &&
this.files[0];

if(!file){

return;

}

if(musicURL){

URL.revokeObjectURL(musicURL);

}

musicURL=
URL.createObjectURL(file);

music.src=musicURL;

music.load();

musicReady=true;

status("🎵 Music ready");

});


/* VOLUME */

function updateVolume(){

const videoVolume=
Number(
document.getElementById("videoVolume").value
);

const musicVolume=
Number(
document.getElementById("musicVolume").value
);

video.volume=
videoVolume/100;

music.volume=
musicVolume/100;

document
.getElementById("videoVolumeValue")
.innerText=
videoVolume+"%";

document
.getElementById("musicVolumeValue")
.innerText=
musicVolume+"%";

}

document
.getElementById("videoVolume")
.oninput=updateVolume;

document
.getElementById("musicVolume")
.oninput=updateVolume;

updateVolume();


/* SPEED */

document
.getElementById("speed")
.oninput=function(){

const value=
Number(this.value);

video.playbackRate=value;

document
.getElementById("speedValue")
.innerText=
value+"×";

};


/* ADJUSTMENTS */

function updateAdjustments(){

document
.getElementById("brightnessValue")
.innerText=
document
.getElementById("brightness")
.value+"%";

document
.getElementById("contrastValue")
.innerText=
document
.getElementById("contrast")
.value+"%";

document
.getElementById("saturationValue")
.innerText=
document
.getElementById("saturation")
.value+"%";

document
.getElementById("temperatureValue")
.innerText=
document
.getElementById("temperature")
.value;

document
.getElementById("blurValue")
.innerText=
document
.getElementById("blur")
.value+"px";

document
.getElementById("zoomValue")
.innerText=
document
.getElementById("zoom")
.value+"%";

}

[
"brightness",
"contrast",
"saturation",
"temperature",
"blur",
"zoom"
].forEach(function(id){

document
.getElementById(id)
.oninput=updateAdjustments;

});

updateAdjustments();


/* TRIM */

function setStart(){

if(!videoReady){

alert(
"पहले video select करो"
);

return;

}

document
.getElementById("start")
.value=
video.currentTime.toFixed(1);

status("✂️ Start set");

}


/* SPLIT VIDEO */

function splitVideo(){

  if(!videoReady){

    alert("पहले video select करो");

    return;

  }

  const point =
    Number(
      document.getElementById("splitPoint").value
    );

  const duration =
    video.duration;

  if(point <= 0 || point >= duration){

    alert(
      "Split point video के बीच में होना चाहिए"
    );

    return;

  }

  document
    .getElementById("start")
    .value = 0;

  document
    .getElementById("end")
    .value =
      point.toFixed(1);

  const result =
    document.getElementById("splitResult");

  result.style.display = "block";

  result.innerHTML =
    "✂️ <b>Video Split Ready</b><br><br>" +

    "🎬 Part 1: 0s → " +
    point.toFixed(1) +
    "s<br><br>" +

    "🎬 Part 2: " +
    point.toFixed(1) +
    "s → " +
    duration.toFixed(1) +
    "s";

  status(
    "✂️ Video split — Part 1 selected"
  );

  }


/* AI */

function runRealAI(){

if(!videoReady){

alert(
"पहले video select करो"
);

return;

}

const aiButton=
document.getElementById("aiButton");

aiButton.disabled=true;

status(
"🧠 NAVAL SMART AI video analyze कर रहा है..."
);

progress(10);

setTimeout(function(){

try{

const duration=
video.duration||10;

const width=
video.videoWidth||0;

const height=
video.videoHeight||0;

let start=0;

let end=
Math.min(duration,30);

if(duration>60){

start=
duration*.20;

end=
Math.min(
start+30,
duration
);

}else if(duration>30){

start=
duration*.10;

end=
Math.min(
start+30,
duration
);

}

let format="vertical";

if(width>height*1.2){

format="landscape";

}else if(
Math.abs(width-height)<
width*.15
){

format="square";

}

const effects=[

{
name:"🔥 Fire Boost",
filter:
"contrast(1.6) saturate(1.8) brightness(1.08)"
},

{
name:"💎 HDR Pop",
filter:
"contrast(1.45) saturate(1.9) brightness(1.05)"
},

{
name:"⚡ Gaming Cinematic",
filter:
"contrast(1.35) saturate(1.4)"
},

{
name:"🌌 Cyberpunk",
filter:
"contrast(1.4) saturate(1.7) hue-rotate(25deg)"
},

{
name:"🌑 Dark Gaming",
filter:
"contrast(1.5) brightness(.85) saturate(1.25)"
}

];

const effect=
effects[
Math.floor(
Math.random()*effects.length
)
];

const captions=[

"🔥 NAVAL GAMING",

"⚡ EPIC GAMING MOMENT",

"💥 WAIT FOR IT...",

"🎯 INSANE GAMEPLAY",

"👑 NAVAL GAMING OP",

"🔥 BEST GAMING MOMENT"

];

const caption=
captions[
Math.floor(
Math.random()*captions.length
)
];

document
.getElementById("start")
.value=
start.toFixed(1);

document
.getElementById("end")
.value=
end.toFixed(1);

document
.getElementById("format")
.value=
format;

document
.getElementById("quality")
.value="720";

document
.getElementById("videoText")
.value=
caption;

document
.getElementById("filter")
.value=
effect.filter;

document
.getElementById("brightness")
.value=105;

document
.getElementById("contrast")
.value=115;

document
.getElementById("saturation")
.value=125;

document
.getElementById("temperature")
.value=5;

document
.getElementById("zoom")
.value=105;

document
.getElementById("speed")
.value=1;

document
.getElementById("videoVolume")
.value=85;

document
.getElementById("musicVolume")
.value=20;

updateVolume();

updateAdjustments();

document
.getElementById("speedValue")
.innerText="1×";

const result=
document.getElementById("aiResult");

result.style.display="block";

result.innerHTML=
"✅ <b>NAVAL SMART AI COMPLETE</b><br><br>"+
"✂️ Best Section: "+
start.toFixed(1)+
"s → "+
end.toFixed(1)+
"s<br>"+
"📱 Format: "+
format+
"<br>"+
"🎥 Quality: 720p<br>"+
"⚡ Speed: 1×<br>"+
"📝 Caption: "+
caption+
"<br>"+
"🎨 Effect: "+
effect.name+
"<br>"+
"☀️ Brightness: 105%<br>"+
"🌓 Contrast: 115%<br>"+
"🎨 Saturation: 125%";

progress(100);

status(
"✅ Smart Auto Edit तैयार है"
);

}catch(error){

console.error(error);

status(
"❌ Smart AI error"
);

}

aiButton.disabled=false;

},800);

}


/* PREVIEW */

async function previewEdit(){

if(!videoReady){

alert(
"पहले video select करो"
);

return;

}

const start=
Number(
document.getElementById("start").value
);

const end=
Number(
document.getElementById("end").value
);

if(end<=start){

alert(
"End time सही करो"
);

return;

}

video.pause();

video.currentTime=start;

video.playbackRate=
Number(
document.getElementById("speed").value
);

try{

await video.play();

if(musicReady){

music.currentTime=0;

music.play().catch(
function(){}
);

}

status(
"▶️ Preview चल रहा है"
);

}catch(error){

console.error(error);

status(
"❌ Browser playback error"
);

return;

}

video.ontimeupdate=function(){

if(video.currentTime>=end){

video.pause();

if(musicReady){

music.pause();

}

video.ontimeupdate=null;

status(
"✅ Preview finished"
);

}

};

}


/* CANVAS SIZE */

function getCanvasSize(){

const format=
document.getElementById("format").value;

const quality=
Number(
document.getElementById("quality").value
);

let w,h;

if(format==="vertical"){

h=quality;

w=Math.round(
h*9/16
);

}else if(format==="landscape"){

w=quality;

h=Math.round(
w*9/16
);

}else{

w=quality;

h=quality;

}

return {w:w,h:h};

}


/* DRAW FRAME */

function drawFrame(){

if(!video.videoWidth){

return;

}

const size=
getCanvasSize();

const w=size.w;

const h=size.h;

canvas.width=w;

canvas.height=h;

ctx.fillStyle="#000";

ctx.fillRect(
0,
0,
w,
h
);

const start=
Number(
document.getElementById("start").value
)||0;

const end=
Number(
document.getElementById("end").value
)||video.duration;

const duration=
Math.max(
.1,
end-start
);

const elapsed=
Math.max(
0,
video.currentTime-start
);

const progressTime=
Math.min(
1,
elapsed/duration
);


/* ZOOM */

let zoom=
Number(
document.getElementById("zoom").value
)/100;

if(
document
.getElementById("autoZoom")
.checked
){

zoom*=
1+
(progressTime*.08);

}


/* SHAKE */

let shakeX=0;

let shakeY=0;

if(
document
.getElementById("shakeEffect")
.checked
){

shakeX=
(Math.random()-.5)*3;

shakeY=
(Math.random()-.5)*3;

}


/* SCALE */

const scale=
Math.max(
w/video.videoWidth,
h/video.videoHeight
)*zoom;

const nw=
video.videoWidth*scale;

const nh=
video.videoHeight*scale;


/* FILTER */

const brightness=
Number(
document.getElementById("brightness").value
);

const contrast=
Number(
document.getElementById("contrast").value
);

const saturation=
Number(
document.getElementById("saturation").value
);

const blur=
Number(
document.getElementById("blur").value
);

let filter=
"brightness("+
(brightness/100)+
") "+
"contrast("+
(contrast/100)+
") "+
"saturate("+
(saturation/100)+
") "+
"blur("+
blur+
"px)";

const preset=
document.getElementById("filter").value;

if(preset!=="none"){

filter+=" "+preset;

}


/* DRAW */

ctx.save();

ctx.translate(
w/2,
h/2
);

ctx.rotate(
Number(
document.getElementById("rotation").value
)*
Math.PI/180
);

ctx.filter=filter;

ctx.drawImage(
video,
-nw/2+shakeX,
-nh/2+shakeY,
nw,
nh
);

ctx.restore();

ctx.filter="none";


/* TEMPERATURE */

const temp=
Number(
document.getElementById("temperature").value
);

if(temp!==0){

if(temp>0){

ctx.fillStyle=
"rgba(255,120,40,"+
(Math.abs(temp)/50*.16)+
")";

}else{

ctx.fillStyle=
"rgba(40,150,255,"+
(Math.abs(temp)/50*.16)+
")";

}

ctx.fillRect(
0,
0,
w,
h
);

}


/* FLASH */

if(
document
.getElementById("flashEffect")
.checked
){

const flashTime=.12;

let flash=0;

if(elapsed<flashTime){

flash=
1-
elapsed/flashTime;

}

if(
elapsed>
duration-flashTime
){

flash=Math.max(
flash,
(elapsed-
(duration-flashTime))
/flashTime
);

}

if(flash>0){

ctx.fillStyle=
"rgba(255,255,255,"+
Math.min(
.35,
flash*.35
)+
")";

ctx.fillRect(
0,
0,
w,
h
);

}

}


/* CAPTION */

const text=
document
.getElementById("videoText")
.value
.trim();

if(text){

ctx.font=
"bold "+
Math.max(
30,
w*.055
)+
"px Arial";

ctx.textAlign="center";

ctx.textBaseline="bottom";

ctx.lineWidth=6;

ctx.strokeStyle="#000";

ctx.fillStyle="#fff";

ctx.strokeText(
text,
w/2,
h-70
);

ctx.fillText(
text,
w/2,
h-70
);

}

}


/* CREATE VIDEO */

async function createEditedVideo(){

if(exporting){

return;

}

if(!videoReady){

alert(
"पहले video select करो"
);

return;

}

if(
!canvas.captureStream||
!window.MediaRecorder
){

alert(
"इस browser/app में video export support नहीं है। Preview फिर भी चल सकता है।"
);

return;

}

const start=
Number(
document.getElementById("start").value
);

const end=
Number(
document.getElementById("end").value
);

if(end<=start){

alert(
"End time सही करो"
);

return;

}

exporting=true;

document
.getElementById("downloadButton")
.disabled=true;

status(
"🎬 Video export शुरू..."
);

progress(5);

video.pause();

video.ontimeupdate=null;

video.currentTime=start;

video.playbackRate=
Number(
document.getElementById("speed").value
);

await new Promise(function(resolve){

function seeked(){

video.removeEventListener(
"seeked",
seeked
);

resolve();

}

video.addEventListener(
"seeked",
seeked
);

});


/* CANVAS */

drawFrame();

const canvasStream=
canvas.captureStream(30);

let tracks=
canvasStream
.getVideoTracks()
.slice();

const stream=
new MediaStream(tracks);


/*
 IMPORTANT:
 मोबाइल WebView में सीधे
 video.captureStream() कई बार
 crash/back करा सकता है।
 इसलिए इसे optional रखा गया है।
*/

try{

let audioStream=null;

if(
typeof video.captureStream===
"function"
){

audioStream=
video.captureStream();

}else if(
typeof video.mozCaptureStream===
"function"
){

audioStream=
video.mozCaptureStream();

}

if(audioStream){

audioStream
.getAudioTracks()
.forEach(function(track){

stream.addTrack(track);

});

}

}catch(error){

console.log(
"Audio capture unavailable"
);

}


/* MIME */

let mime=
"video/webm;codecs=vp9";

if(
!MediaRecorder
.isTypeSupported(mime)
){

mime=
"video/webm;codecs=vp8";

}

if(
!MediaRecorder
.isTypeSupported(mime)
){

mime="video/webm";

}


/* RECORDER */

let recorder;

try{

recorder=
new MediaRecorder(
stream,
{
mimeType:mime,
videoBitsPerSecond:4000000
}
);

}catch(error){

console.error(error);

exporting=false;

alert(
"इस device/browser में video export उपलब्ध नहीं है।"
);

return;

}

const chunks=[];

recorder.ondataavailable=
function(event){

if(event.data.size){

chunks.push(
event.data
);

}

};


recorder.onerror=
function(event){

console.error(
"Recorder error:",
event
);

status(
"❌ Export error"
);

exporting=false;

};


recorder.onstop=
function(){

editedBlob=
new Blob(
chunks,
{
type:mime
}
);

if(editedURL){

URL.revokeObjectURL(
editedURL
);

}

editedURL=
URL.createObjectURL(
editedBlob
);

document
.getElementById("downloadButton")
.disabled=false;

progress(100);

status(
"✅ Edited video तैयार है — DOWNLOAD दबाओ"
);

exporting=false;

};


/* START */

recorder.start(250);

try{

await video.play();

}catch(error){

console.error(error);

recorder.stop();

exporting=false;

return;

}


/* RENDER */

function render(){

if(!exporting){

return;

}

if(
video.paused||
video.ended
){

return;

}

drawFrame();

const current=
Math.max(
0,
video.currentTime-start
);

const total=
Math.max(
.1,
end-start
);

const p=
Math.min(
1,
current/total
);

progress(
5+
p*90
);

requestAnimationFrame(
render
);

}

render();


/* END */

video.ontimeupdate=
function(){

if(
video.currentTime>=end
){

video.pause();

video.ontimeupdate=null;

drawFrame();

setTimeout(function(){

if(
recorder.state!=="inactive"
){

recorder.stop();

}

},100);

}

};

}


/* DOWNLOAD */

async function downloadEditedVideo(){

  if(!editedBlob){

    alert("पहले video create करो");
    return;

  }

  const button =
    document.getElementById("downloadButton");

  button.disabled = true;

  progress(0);
  status("⬇️ Video तैयार हो रहा है... 0%");

  try{

    /*
      APK/WebView और Browser दोनों के लिए
      पहले Share API try करेंगे
    */

    const fileName =
      "NAVAL_AI_EDIT.webm";

    const file =
      new File(
        [editedBlob],
        fileName,
        {
          type:
            editedBlob.type ||
            "video/webm"
        }
      );

    progress(30);
    status("⬇️ Download preparing... 30%");

    /*
      Android Share / Save
    */

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      progress(50);
      status("📤 Share / Save खोल रहे हैं... 50%");

      try{

        await navigator.share({

          title:
            "NAVAL AI EDITED VIDEO",

          text:
            "NAVAL AI VIDEO EDITOR",

          files:[file]

        });

        progress(100);

        status(
          "✅ Video Share / Save हो गया"
        );

        button.disabled = false;

        return;

      }catch(shareError){

        console.log(
          "Share unavailable:",
          shareError
        );

      }

    }

    /*
      Browser fallback
    */

    progress(70);
    status("⬇️ Download शुरू हो रहा है... 70%");

    const url =
      URL.createObjectURL(editedBlob);

    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      fileName;

    link.style.display =
      "none";

    document.body.appendChild(link);

    link.click();

    progress(100);

    status(
      "✅ Download started — 100%"
    );

    setTimeout(function(){

      link.remove();

      URL.revokeObjectURL(url);

      button.disabled = false;

    },5000);

  }catch(error){

    console.error(
      "Download error:",
      error
    );

    progress(0);

    status(
      "❌ Download failed"
    );

    button.disabled = false;

    alert(
      "Video save नहीं हो पाया।"
    );

  }

  }

/* RESET */

function resetEditor(){

if(exporting){

return;

}

if(videoURL){

URL.revokeObjectURL(
videoURL
);

}

if(musicURL){

URL.revokeObjectURL(
musicURL
);

}

if(editedURL){

URL.revokeObjectURL(
editedURL
);

}

location.reload();

}
