<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAVAL AI VIDEO EDITOR V6</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px 10px;background:#111;border-bottom:1px solid #333}
header h1{margin:0;font-size:25px}
header p{margin:7px 0;color:#999}
.container{max-width:700px;margin:auto;padding:15px}
.card{background:#171717;border-radius:18px;padding:18px;margin-bottom:15px}
label{display:block;color:#bbb;margin:12px 0 7px}
input[type=file],input[type=text],input[type=number],select{
width:100%;padding:14px;border:0;border-radius:10px;background:#292929;color:white;font-size:16px}
input[type=range]{width:100%;accent-color:#00d9ff}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;
background:#08cbea;color:#000;font-weight:bold;font-size:17px;cursor:pointer}
button:disabled{opacity:.5}
.ai{background:#8b4dff;color:white;font-size:20px}
.green{background:#20d66b}
.red{background:#e53935;color:white}
.row{display:flex;gap:10px}
.row button{flex:1}
video{width:100%;max-height:430px;background:#000;border-radius:12px;margin-top:10px}
audio{width:100%;margin-top:10px}
canvas{display:none}
.value{float:right;color:#00d9ff;font-weight:bold}
.status{text-align:center;color:#00d9ff;min-height:25px}
.progressBox{width:100%;height:12px;background:#292929;border-radius:20px;overflow:hidden;margin-top:12px}
.progressBar{width:0%;height:100%;background:#08cbea;transition:.2s}
.badge{display:inline-block;margin-top:8px;padding:7px 10px;border-radius:20px;background:#242424;color:#aaa;font-size:13px}
.result{display:none;margin-top:12px;padding:14px;background:#101010;border-radius:12px;line-height:1.6}
</style>
</head>

<body>

<header>
<h1>🧠 NAVAL AI VIDEO EDITOR V6</h1>
<p>Real AI Smart Editing Studio</p>
</header>

<div class="container">

<div class="card">
<label>🎥 Video Select करो</label>
<input type="file" id="videoFile" accept="video/*">

<video id="video" controls playsinline preload="metadata"></video>

<div class="badge" id="videoInfo">No video selected</div>
</div>

<div class="card">
<label>📱 Output Format</label>
<select id="format">
<option value="vertical">📱 Shorts / Reels — 9:16</option>
<option value="landscape">🖥️ YouTube — 16:9</option>
<option value="square">⬛ Square — 1:1</option>
</select>
</div>

<div class="card">
<label>🎵 Background Music</label>
<input type="file" id="musicFile" accept="audio/*">
<audio id="music" controls></audio>
</div>

<div class="card">

<label>
🔊 Original Video
<span class="value" id="videoVolumeValue">100%</span>
</label>

<input type="range" id="videoVolume" min="0" max="100" value="100">

<label>
🎵 Background Music
<span class="value" id="musicVolumeValue">30%</span>
</label>

<input type="range" id="musicVolume" min="0" max="100" value="30">

</div>

<div class="card">

<label>✂️ Start Time</label>
<input type="number" id="start" value="0" min="0" step="0.1">

<label>⏱️ End Time</label>
<input type="number" id="end" value="0" min="0" step="0.1">

<div class="row">
<button onclick="setStart()">SET START</button>
<button onclick="setEnd()">SET END</button>
</div>

</div>

<div class="card">
<label>📝 Caption</label>
<input type="text" id="videoText" placeholder="NAVAL GAMING 🔥">
</div>
<div class="card">
<label>🎬 Pro Gaming Effects</label>

<label>🎨 AI Effect</label>
<select id="filter">
  <option value="none">Normal</option>
  <option value="contrast(1.6) saturate(1.8) brightness(1.08)">🔥 Fire Boost</option>
  <option value="contrast(1.45) saturate(1.9) brightness(1.05)">💎 HDR Pop</option>
  <option value="contrast(1.35) saturate(1.4)">⚡ Gaming Cinematic</option>
  <option value="contrast(1.4) saturate(1.7) hue-rotate(25deg)">🌌 Cyberpunk</option>
  <option value="contrast(1.5) brightness(.85) saturate(1.25)">🌑 Dark Gaming</option>
</select>

<label><input type="checkbox" id="autoZoom" checked> 🎯 Auto Zoom</label>
<label><input type="checkbox" id="shakeEffect" checked> 💥 Shake Effect</label>
<label><input type="checkbox" id="flashEffect" checked> ⚡ Flash Effect</label>
</div>
<div class="card">

<button class="ai" id="aiButton" onclick="runRealAI()">
🧠 REAL AI AUTO EDIT
</button>

<div id="aiResult" class="result"></div>

</div>

<div class="card">

<button onclick="previewEdit()">▶️ PLAY PREVIEW</button>

<button onclick="createEditedVideo()">🎬 CREATE EDITED VIDEO</button>

<button class="green" id="downloadButton"
onclick="downloadEditedVideo()" disabled>
⬇️ DOWNLOAD VIDEO
</button>

<button class="red" onclick="location.reload()">
🔄 RESET
</button>

</div>

<div class="card">

<div class="status" id="status">
Video select करो
</div>

<div class="progressBox">
<div class="progressBar" id="progressBar"></div>
</div>

</div>

</div>

<canvas id="canvas"></canvas>

<script>

const video=document.getElementById("video");
const music=document.getElementById("music");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const statusText=document.getElementById("status");
const progressBar=document.getElementById("progressBar");

let videoURL="";
let musicURL="";
let videoReady=false;
let musicReady=false;

let editedBlob=null;
let editedURL="";

function status(t){
statusText.innerText=t;
}

function progress(v){
progressBar.style.width=Math.max(0,Math.min(100,v))+"%";
}

/* VIDEO */

document.getElementById("videoFile").addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(videoURL)URL.revokeObjectURL(videoURL);

videoURL=URL.createObjectURL(file);

video.src=videoURL;
video.load();

video.onloadedmetadata=function(){

videoReady=true;

document.getElementById("start").value=0;

document.getElementById("end").value=
video.duration.toFixed(1);

document.getElementById("videoInfo").innerText=
"🎥 "+Math.round(video.duration)+" sec video";

status("✅ Video ready");

progress(0);
};

video.onerror=function(){
status("❌ Video load error");
};

});

/* MUSIC */

document.getElementById("musicFile").addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(musicURL)URL.revokeObjectURL(musicURL);

musicURL=URL.createObjectURL(file);

music.src=musicURL;
music.load();
musicReady=true;

status("🎵 Music ready");

});

/* VOLUME */

function updateVolume(){

const vv=
Number(document.getElementById("videoVolume").value);

const mv=
Number(document.getElementById("musicVolume").value);

video.volume=vv/100;
music.volume=mv/100;

document.getElementById("videoVolumeValue").innerText=vv+"%";
document.getElementById("musicVolumeValue").innerText=mv+"%";
}

document.getElementById("videoVolume").oninput=updateVolume;
document.getElementById("musicVolume").oninput=updateVolume;

updateVolume();

/* TRIM */

function setStart(){

if(!videoReady){
alert("पहले video select करो");
return;
}

document.getElementById("start").value=
video.currentTime.toFixed(1);

status("✂️ Start set");
}

function setEnd(){

if(!videoReady){
alert("पहले video select करो");
return;
}

document.getElementById("end").value=
video.currentTime.toFixed(1);

status("✂️ End set");
}

function runRealAI(){

  if(!videoReady){
    alert("पहले video select करो");
    return;
  }

  const aiButton = document.getElementById("aiButton");

  aiButton.disabled = true;

  status("🧠 NAVAL SMART AI video analyze कर रहा है...");
  progress(10);

  setTimeout(() => {

    try {

      const duration = video.duration || 10;
      const width = video.videoWidth || 0;
      const height = video.videoHeight || 0;

      /* SMART VIDEO ANALYSIS */

      let start = 0;
      let end = Math.min(duration, 30);

      /* Best section selection */

      if(duration > 60){

        start = duration * 0.20;
        end = Math.min(start + 30, duration);

      }else if(duration > 30){

        start = duration * 0.10;
        end = Math.min(start + 30, duration);

      }else{

        start = 0;
        end = duration;

      }

      /* FORMAT */

      let format = "vertical";

      if(width > height * 1.2){

        format = "landscape";

      }else if(
        Math.abs(width - height) < width * 0.15
      ){

        format = "square";

      }

      /* GAMING EFFECT */

      const effects = [

        {
          name:"🔥 Fire Boost",
          filter:"contrast(1.6) saturate(1.8) brightness(1.08)"
        },

        {
          name:"💎 HDR Pop",
          filter:"contrast(1.45) saturate(1.9) brightness(1.05)"
        },

        {
          name:"⚡ Gaming Cinematic",
          filter:"contrast(1.35) saturate(1.4)"
        },

        {
          name:"🌌 Cyberpunk",
          filter:"contrast(1.4) saturate(1.7) hue-rotate(25deg)"
        },

        {
          name:"🌑 Dark Gaming",
          filter:"contrast(1.5) brightness(.85) saturate(1.25)"
        }

      ];

      const effect =
        effects[Math.floor(Math.random()*effects.length)];

      /* CAPTION */

      const captions = [

        "🔥 NAVAL GAMING",

        "⚡ EPIC GAMING MOMENT",

        "💥 WAIT FOR IT...",

        "🎯 INSANE GAMEPLAY",

        "👑 NAVAL GAMING OP",

        "🔥 BEST GAMING MOMENT"

      ];

      const caption =
        captions[Math.floor(Math.random()*captions.length)];

      /* APPLY AI DECISIONS */

      document.getElementById("start").value =
        start.toFixed(1);

      document.getElementById("end").value =
        end.toFixed(1);

      document.getElementById("format").value =
        format;

      document.getElementById("videoText").value =
        caption;

      document.getElementById("filter").value =
        effect.filter;

      document.getElementById("videoVolume").value = 85;

      document.getElementById("musicVolume").value = 20;

      updateVolume();

      /* RESULT */

      const result =
        document.getElementById("aiResult");

      result.style.display = "block";

      result.innerHTML =
        "✅ <b>NAVAL SMART AI COMPLETE</b><br><br>" +

        "✂️ Best Section: " +
        start.toFixed(1) +
        "s → " +
        end.toFixed(1) +
        "s<br>" +

        "📱 Format: " +
        format +
        "<br>" +

        "📝 Caption: " +
        caption +
        "<br>" +

        "🎨 Effect: " +
        effect.name +
        "<br>" +

        "🔊 Video: 85%<br>" +

        "🎵 Music: 20%";

      progress(100);

      status(
        "✅ Smart Auto Edit तैयार है"
      );

    } catch(error){

      console.error(error);

      status(
        "❌ Smart AI error"
      );

    }

    aiButton.disabled = false;

  },1000);

  }

/* PREVIEW */

async function previewEdit(){

if(!videoReady){
alert("पहले video select करो");
return;
}

const start=Number(document.getElementById("start").value);
const end=Number(document.getElementById("end").value);

if(end<=start){
alert("End time सही करो");
return;
}

video.pause();

video.currentTime=start;

try{

await video.play();

if(musicReady){
music.currentTime=0;
music.play().catch(()=>{});
}

status("▶️ Preview चल रहा है");

}catch(e){

status("❌ Browser playback error");

return;

}

video.ontimeupdate=function(){

if(video.currentTime>=end){

video.pause();

if(musicReady)music.pause();

video.ontimeupdate=null;

status("✅ Preview finished");

}

};

}

/* DRAW */

function drawFrame(){

  if(!video.videoWidth)return;

  const format=document.getElementById("format").value;

  let w=720;
  let h=1280;

  if(format==="landscape"){
    w=1280;
    h=720;
  }

  if(format==="square"){
    w=1080;
    h=1080;
  }

  canvas.width=w;
  canvas.height=h;

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,w,h);

  /*
   * AUTO ZOOM
   * हल्का cinematic zoom
   */

  const start=
    Number(document.getElementById("start").value)||0;

  const end=
    Number(document.getElementById("end").value)||video.duration;

  const duration=Math.max(0.1,end-start);

  const elapsed=
    Math.max(0,video.currentTime-start);

  const progressTime=
    Math.min(1,elapsed/duration);

  const zoom=
    1 + (progressTime * 0.08);

  /*
   * SHAKE EFFECT
   * gaming-style हल्का movement
   */

  const shakeAmount=3;

  const shakeX=
    (Math.random()-0.5)*shakeAmount;

  const shakeY=
    (Math.random()-0.5)*shakeAmount;

  /*
   * VIDEO SCALE
   */

  const scale=Math.max(
    w/video.videoWidth,
    h/video.videoHeight
  ) * zoom;

  const nw=video.videoWidth*scale;
  const nh=video.videoHeight*scale;

  const x=
    (w-nw)/2 + shakeX;

  const y=
    (h-nh)/2 + shakeY;

  /*
   * FILTER
   */

  ctx.filter=
    document.getElementById("filter").value;

  ctx.drawImage(
    video,
    x,
    y,
    nw,
    nh
  );

  ctx.filter="none";

  /*
   * FLASH EFFECT
   * शुरुआत और अंत में हल्का flash
   */

  const flashTime=0.12;

  let flash=0;

  if(elapsed<flashTime){

    flash=
      1-(elapsed/flashTime);

  }

  if(elapsed>duration-flashTime){

    flash=
      Math.max(
        flash,
        (elapsed-(duration-flashTime))/flashTime
      );

  }

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(0.35,flash*0.35)+")";

    ctx.fillRect(
      0,
      0,
      w,
      h
    );

  }

  /*
   * CAPTION
   */

  const text=
    document.getElementById("videoText").value.trim();

  if(text){

    ctx.font=
      "bold "+
      Math.max(35,w*.055)+
      "px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="bottom";

    ctx.lineWidth=6;

    ctx.strokeStyle="#000";
    ctx.fillStyle="#fff";

    ctx.strokeText(
      text,
      w/2,
      h-70
    );

    ctx.fillText(
      text,
      w/2,
      h-70
    );

  }

}

/* EXPORT */

async function createEditedVideo(){

if(!videoReady){
alert("पहले video select करो");
return;
}

if(!canvas.captureStream||!window.MediaRecorder){

alert("इस browser में export support नहीं है");
return;
}

const start=Number(document.getElementById("start").value);
const end=Number(document.getElementById("end").value);

if(end<=start){
alert("End time सही करो");
return;
}

status("🎬 Video export शुरू...");
progress(30);

drawFrame();

const stream=canvas.captureStream(30);

let mime="video/webm;codecs=vp9";

if(!MediaRecorder.isTypeSupported(mime))
mime="video/webm;codecs=vp8";

if(!MediaRecorder.isTypeSupported(mime))
mime="video/webm";

const recorder=new MediaRecorder(stream,{mimeType:mime});

const chunks=[];

recorder.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};

recorder.onstop=()=>{

editedBlob=new Blob(chunks,{type:mime});

if(editedURL)URL.revokeObjectURL(editedURL);

editedURL=URL.createObjectURL(editedBlob);

document.getElementById("downloadButton").disabled=false;

progress(100);

status("✅ Edited video तैयार है");

};

video.pause();

video.currentTime=start;

await new Promise(resolve=>{

const f=()=>{

video.removeEventListener("seeked",f);
resolve();

};

video.addEventListener("seeked",f);

});

recorder.start(200);

await video.play();

function render(){

if(video.paused||video.ended)return;

drawFrame();

const p=(video.currentTime-start)/(end-start);

progress(30+p*65);

requestAnimationFrame(render);

}

render();

video.ontimeupdate=()=>{

if(video.currentTime>=end){

video.pause();

video.ontimeupdate=null;

drawFrame();

recorder.stop();

}

};

}

/* DOWNLOAD */

function downloadEditedVideo(){

if(!editedBlob){

alert("पहले video create करो");
return;
}

const a=document.createElement("a");

a.href=editedURL;
a.download="NAVAL_AI_EDIT.webm";

document.body.appendChild(a);
a.click();
a.remove();

status("⬇️ Download started");

}

</script>

</body>
  </html>
