<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAVAL AI VIDEO EDITOR V5</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
  background:#111;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  color:#999;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#171717;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

label{
  display:block;
  color:#bbb;
  margin:12px 0 7px;
}

input[type=file],
input[type=text],
input[type=number],
select{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:white;
  font-size:16px;
}

input[type=range]{
  width:100%;
  accent-color:#00d9ff;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#08cbea;
  color:#000;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.smart{
  background:#8b4dff;
  color:#fff;
  font-size:20px;
}

.aiTest{
  background:#ff9f1c;
}

.green{
  background:#20d66b;
}

.red{
  background:#e53935;
  color:#fff;
}

.row{
  display:flex;
  gap:10px;
}

.row button{
  flex:1;
}

video{
  width:100%;
  max-height:430px;
  background:#000;
  border-radius:12px;
  margin-top:10px;
}

audio{
  width:100%;
  margin-top:10px;
}

canvas{
  display:none;
}

.value{
  float:right;
  color:#00d9ff;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#00d9ff;
  min-height:25px;
}

.progressBox{
  width:100%;
  height:12px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progressBar{
  width:0%;
  height:100%;
  background:#08cbea;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:7px 10px;
  border-radius:20px;
  background:#242424;
  color:#aaa;
  font-size:13px;
}

.info{
  margin-top:10px;
  padding:12px;
  background:#101010;
  border-radius:12px;
  color:#aaa;
  line-height:1.5;
}

#aiResult{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#101010;
  border-radius:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
<h1>🧠 NAVAL AI VIDEO EDITOR V5</h1>
<p>Smart Automatic Editing Studio</p>
</header>

<div class="container">

<!-- VIDEO -->
<div class="card">

<label>🎥 Select Video</label>

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<video
  id="video"
  controls
  playsinline
  preload="metadata">
</video>

<div
  class="badge"
  id="videoInfo">
  No video selected
</div>

</div>


<!-- FORMAT -->
<div class="card">

<label>📱 Output Format</label>

<select id="format">

<option value="vertical">
📱 Shorts / Reels — 9:16
</option>

<option value="landscape">
🖥️ YouTube — 16:9
</option>

<option value="square">
⬛ Square — 1:1
</option>

</select>

</div>


<!-- MUSIC -->
<div class="card">

<label>🎵 Background Music</label>

<input
  type="file"
  id="musicFile"
  accept="audio/*"
>

<audio
  id="music"
  controls>
</audio>

</div>


<!-- VOLUME -->
<div class="card">

<label>
🔊 Original Video
<span
  class="value"
  id="videoVolumeValue">
  100%
</span>
</label>

<input
  type="range"
  id="videoVolume"
  min="0"
  max="100"
  value="100"
>

<label>
🎵 Background Music
<span
  class="value"
  id="musicVolumeValue">
  30%
</span>
</label>

<input
  type="range"
  id="musicVolume"
  min="0"
  max="100"
  value="30"
>

</div>


<!-- TRIM -->
<div class="card">

<label>✂️ Start Time</label>

<input
  type="number"
  id="start"
  value="0"
  min="0"
  step="0.1"
>

<label>⏱️ End Time</label>

<input
  type="number"
  id="end"
  value="0"
  min="0"
  step="0.1"
>

<div class="row">

<button onclick="setStart()">
SET START
</button>

<button onclick="setEnd()">
SET END
</button>

</div>

</div>


<!-- TEXT -->
<div class="card">

<label>📝 Caption / Text</label>

<input
  type="text"
  id="videoText"
  placeholder="NAVAL GAMING 🔥"
>

</div>


<!-- FILTER -->
<div class="card">

<label>🎨 Editing Style</label>

<select id="filter">

<option value="none">
Normal
</option>

<option value="contrast(1.35) saturate(1.4)">
🔥 Gaming Cinematic
</option>

<option value="contrast(1.5) saturate(1.7)">
⚡ Vivid
</option>

<option value="brightness(1.2) saturate(1.5)">
☀️ Bright
</option>

<option value="grayscale(1)">
⚫ Black & White
</option>

<option value="sepia(.7)">
🎞️ Vintage
</option>

</select>

</div>


<!-- AI -->
<div class="card">

<button
  class="smart"
  id="smartButton"
  onclick="smartAIEdit()">
🧠 SMART AI EDIT
</button>

<button
  class="aiTest"
  id="aiTestButton"
  onclick="testAIBackend()">
🧪 TEST AI BACKEND
</button>

<div class="info">

Smart AI:
<br>• Smart scene selection
<br>• Shorts/Reels format
<br>• Cinematic filter
<br>• Automatic caption
<br>• Smart audio settings

</div>

<div id="aiResult"></div>

</div>


<!-- ACTIONS -->
<div class="card">

<button onclick="previewEdit()">
▶️ PLAY PREVIEW
</button>

<button onclick="createEditedVideo()">
🎬 CREATE EDITED VIDEO
</button>

<button
  class="green"
  id="downloadButton"
  onclick="downloadEditedVideo()">
⬇️ DOWNLOAD VIDEO
</button>

<button
  class="red"
  onclick="resetEditor()">
🔄 RESET
</button>

</div>


<!-- STATUS -->
<div class="card">

<div
  class="status"
  id="status">
Video select करो
</div>

<div class="progressBox">

<div
  class="progressBar"
  id="progressBar">
</div>

</div>

</div>

</div>

<canvas id="canvas"></canvas>


<script>

/* =========================
   ELEMENTS
========================= */

const video =
document.getElementById("video");

const music =
document.getElementById("music");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const smartButton =
document.getElementById("smartButton");

const aiTestButton =
document.getElementById("aiTestButton");

const downloadButton =
document.getElementById("downloadButton");

const aiResult =
document.getElementById("aiResult");


/* =========================
   VARIABLES
========================= */

let videoURL = "";
let musicURL = "";

let videoFileSelected = false;
let musicFileSelected = false;

let editedBlob = null;
let editedURL = "";

let exporting = false;
let animationID = null;


/* =========================
   STATUS
========================= */

function setStatus(text){
  statusText.innerText = text;
}


/* =========================
   PROGRESS
========================= */

function setProgress(value){

  value =
    Math.max(
      0,
      Math.min(100,value)
    );

  progressBar.style.width =
    value + "%";
}


/* =========================
   VOLUME
========================= */

function updateVolumes(){

  const videoVolume =
    Number(
      document.getElementById(
        "videoVolume"
      ).value
    ) / 100;

  const musicVolume =
    Number(
      document.getElementById(
        "musicVolume"
      ).value
    ) / 100;

  video.volume =
    videoVolume;

  music.volume =
    musicVolume;

  document.getElementById(
    "videoVolumeValue"
  ).innerText =
    Math.round(
      videoVolume * 100
    ) + "%";

  document.getElementById(
    "musicVolumeValue"
  ).innerText =
    Math.round(
      musicVolume * 100
    ) + "%";
}


document
.getElementById("videoVolume")
.addEventListener(
  "input",
  updateVolumes
);

document
.getElementById("musicVolume")
.addEventListener(
  "input",
  updateVolumes
);


/* =========================
   VIDEO LOAD
========================= */

document
.getElementById("videoFile")
.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file)
      return;


    videoFileSelected = true;


    if(videoURL){

      URL.revokeObjectURL(
        videoURL
      );

    }


    videoURL =
      URL.createObjectURL(file);


    /*
      IMPORTANT:
      Video gets its own
      object URL.
    */

    video.src =
      videoURL;

    video.load();


    video.onloadedmetadata =
      function(){

        const duration =
          video.duration;


        document.getElementById(
          "start"
        ).value =
          "0";


        document.getElementById(
          "end"
        ).value =
          duration.toFixed(1);


        document.getElementById(
          "videoInfo"
        ).innerText =
          "🎥 " +
          Math.round(duration) +
          " sec video";


        setStatus(
          "✅ Video ready — PLAY दबाओ"
        );


        setProgress(0);


        /*
          Make sure playback
          volume is normal.
        */

        updateVolumes();

      };


    video.onerror =
      function(){

        setStatus(
          "❌ Video load नहीं हो पाया"
        );

      };

  }
);


/* =========================
   MUSIC LOAD
========================= */

document
.getElementById("musicFile")
.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file)
      return;


    musicFileSelected = true;


    if(musicURL){

      URL.revokeObjectURL(
        musicURL
      );

    }


    musicURL =
      URL.createObjectURL(file);


    music.src =
      musicURL;

    music.load();

    music.loop = true;


    setStatus(
      "🎵 Music ready"
    );


    updateVolumes();

  }
);


/* =========================
   SET START
========================= */

function setStart(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  document.getElementById(
    "start"
  ).value =
    video.currentTime.toFixed(1);


  setStatus(
    "✂️ Start time set"
  );
}


/* =========================
   SET END
========================= */

function setEnd(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  document.getElementById(
    "end"
  ).value =
    video.currentTime.toFixed(1);


  setStatus(
    "✂️ End time set"
  );
}


/* =========================
   FORMAT
========================= */

function getFormat(){

  return document.getElementById(
    "format"
  ).value;

}


/* =========================
   DRAW FRAME
========================= */

function drawFrame(){

  if(!video.videoWidth)
    return;


  const format =
    getFormat();


  let cw;
  let ch;


  if(format === "vertical"){

    cw = 720;
    ch = 1280;

  }else if(format === "square"){

    cw = 1080;
    ch = 1080;

  }else{

    cw = 1280;
    ch = 720;

  }


  canvas.width = cw;
  canvas.height = ch;


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    cw,
    ch
  );


  const scale =
    Math.max(
      cw / video.videoWidth,
      ch / video.videoHeight
    );


  const nw =
    video.videoWidth * scale;

  const nh =
    video.videoHeight * scale;


  const x =
    (cw - nw) / 2;

  const y =
    (ch - nh) / 2;


  ctx.filter =
    document.getElementById(
      "filter"
    ).value;


  ctx.drawImage(
    video,
    x,
    y,
    nw,
    nh
  );


  ctx.filter =
    "none";


  const text =
    document.getElementById(
      "videoText"
    ).value.trim();


  if(text){

    ctx.font =
      "bold " +
      Math.max(
        35,
        cw * .055
      ) +
      "px Arial";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "bottom";


    ctx.lineWidth =
      6;


    ctx.strokeStyle =
      "black";


    ctx.fillStyle =
      "white";


    ctx.strokeText(
      text,
      cw / 2,
      ch - 70
    );


    ctx.fillText(
      text,
      cw / 2,
      ch - 70
    );

  }

}


/* =========================
   PREVIEW
========================= */

async function previewEdit(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(end <= start){

    alert(
      "End time सही करो"
    );

    return;
  }


  /*
    Normal browser playback.
    No AudioContext here.
  */

  video.pause();

  video.currentTime =
    start;


  if(musicFileSelected){

    music.pause();

    music.currentTime =
      0;

  }


  setStatus(
    "▶️ Preview तैयार..."
  );


  try{

    await video.play();


    if(musicFileSelected){

      music.play().catch(
        ()=>{}
      );

    }


    setStatus(
      "▶️ Preview चल रहा है..."
    );


  }catch(error){

    console.error(error);

    setStatus(
      "❌ Browser ने video play नहीं किया"
    );

    return;

  }


  video.ontimeupdate =
    function(){

      if(
        video.currentTime >= end
      ){

        video.pause();

        if(musicFileSelected)
          music.pause();

        video.ontimeupdate =
          null;

        setStatus(
          "✅ Preview finished"
        );

      }

    };

}


/* =========================
   SMART AI
========================= */

async function smartAIEdit(){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  if(exporting)
    return;


  const duration =
    video.duration;


  if(
    !duration ||
    duration <= 0
  ){

    alert(
      "Video पूरी तरह load होने दो"
    );

    return;
  }


  smartButton.disabled =
    true;


  setStatus(
    "🧠 Video analyze हो रहा है..."
  );


  setProgress(5);


  let start = 0;
  let end = duration;


  /*
    Smart section
  */

  if(duration <= 15){

    start = 0;
    end = duration;

  }else if(duration <= 40){

    start =
      duration * .10;

    end =
      Math.min(
        duration,
        start + 20
      );

  }else{

    start =
      duration * .25;

    end =
      Math.min(
        duration,
        start + 20
      );

  }


  document.getElementById(
    "start"
  ).value =
    start.toFixed(1);


  document.getElementById(
    "end"
  ).value =
    end.toFixed(1);


  document.getElementById(
    "format"
  ).value =
    "vertical";


  document.getElementById(
    "videoText"
  ).value =
    "NAVAL GAMING 🔥";


  document.getElementById(
    "filter"
  ).value =
    "contrast(1.35) saturate(1.4)";


  document.getElementById(
    "videoVolume"
  ).value =
    80;


  document.getElementById(
    "musicVolume"
  ).value =
    musicFileSelected
      ? 25
      : 0;


  updateVolumes();


  setProgress(20);


  setStatus(
    "🧠 Smart settings तैयार..."
  );


  /*
    Optional Vercel AI request.
    Failure won't stop local editor.
  */

  try{

    const response =
      await fetch(
        "/api/ai",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            duration:duration,

            format:"vertical",

            text:
              "NAVAL GAMING 🔥"

          })

        }
      );


    if(response.ok){

      const data =
        await response.json();

      if(data.success){

        setStatus(
          "🧠 AI analysis complete"
        );

      }

    }

  }catch(error){

    console.log(
      "Local Smart AI mode"
    );

  }


  setProgress(30);


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        500
      )
  );


  await createEditedVideo(
    true
  );


  smartButton.disabled =
    false;

}


/* =========================
   CREATE EDITED VIDEO
========================= */

async function createEditedVideo(
  automatic = false
){

  if(!videoFileSelected){

    alert(
      "पहले video select करो"
    );

    return;
  }


  if(exporting)
    return;


  const start =
    Number(
      document.getElementById(
        "start"
      ).value
    );


  const end =
    Number(
      document.getElementById(
        "end"
      ).value
    );


  if(end <= start){

    alert(
      "End time सही करो"
    );

    return;
  }


  /*
    Browser support check
  */

  if(
    !canvas.captureStream ||
    !window.MediaRecorder
  ){

    alert(
      "इस browser में video export support नहीं है."
    );

    return;
  }


  exporting = true;

  smartButton.disabled =
    true;

  downloadButton.disabled =
    true;


  try{

    setStatus(
      automatic
      ? "🧠 Smart editing..."
      : "🎬 Video export..."
    );


    setProgress(25);


    /*
      Prepare canvas
    */

    drawFrame();


    const canvasStream =
      canvas.captureStream(30);


    /*
      IMPORTANT:
      No createMediaElementSource.
      Original playback remains normal.
    */

    let stream =
      canvasStream;


    /*
      Video-only export is the
      safest mobile mode.
    */

    let mime =
      "video/webm;codecs=vp9";


    if(
      !MediaRecorder
      .isTypeSupported(mime)
    ){

      mime =
        "video/webm;codecs=vp8";

    }


    if(
      !MediaRecorder
      .isTypeSupported(mime)
    ){

      mime =
        "video/webm";

    }


    const recorder =
      new MediaRecorder(
        stream,
        {
          mimeType:mime
        }
      );


    const chunks = [];


    recorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size > 0
        ){

          chunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      function(){

        editedBlob =
          new Blob(
            chunks,
            {
              type:
                recorder.mimeType
            }
          );


        if(editedURL){

          URL.revokeObjectURL(
            editedURL
          );

        }


        editedURL =
          URL.createObjectURL(
            editedBlob
          );


        exporting = false;

        smartButton.disabled =
          false;

        downloadButton.disabled =
          false;


        setProgress(100);


        setStatus(
          "✅ Edited video तैयार है!"
        );

      };


    /*
      Stop current playback
    */

    video.pause();

    if(musicFileSelected)
      music.pause();


    video.currentTime =
      start;


    await new Promise(
      resolve => {

        const handler =
          function(){

            video.removeEventListener(
              "seeked",
              handler
            );

            resolve();

          };


        video.addEventListener(
          "seeked",
          handler
        );

      }
    );


    recorder.start(200);


    await video.play();


    function render(){

      if(
        video.paused ||
        video.ended
      ){

        return;

      }


      drawFrame();


      const elapsed =
        video.currentTime -
        start;


      const total =
        end - start;


      const percent =
        30 +
        (
          elapsed / total
        ) * 65;


      setProgress(
        Math.min(
          95,
          percent
        )
      );


      animationID =
        requestAnimationFrame(
          render
        );

    }


    render();


    video.ontimeupdate =
      function(){

        if(
          video.currentTime >= end
        ){

          video.pause();


          cancelAnimationFrame(
            animationID
          );


          video.ontimeupdate =
            null;


          drawFrame();


          recorder.stop();

        }

      };


  }catch(error){

    console.error(error);


    exporting = false;


    smartButton.disabled =
      false;

    downloadButton.disabled =
      false;


    setProgress(0);


    setStatus(
      "❌ Export failed"
    );


    alert(
      "Video export नहीं हो पाया."
    );

  }

}


/* =========================
   DOWNLOAD
========================= */

function downloadEditedVideo(){

  if(!editedBlob){

    alert(
      "पहले CREATE EDITED V
